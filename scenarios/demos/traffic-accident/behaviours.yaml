format: aeroagentsim.behaviour-package/v1
id: traffic.accident
revision: 2
registry:
  snapshot: registry.snapshot.json
evaluator:
  version: aerograph-predicate/1
  dialect: original
  native_references_ref: registry.snapshot.json#/details/provenance
  native_references:
  - path: ${AEROAGENTSIM_AEROGRAPH_ROOT}/semantic-directory/src/original_runtime.js
budgets:
  max_transitions_per_instance_per_ns: 64
  max_instances: 10000
  max_timers_per_instance: 16
  max_creations_per_instance: 16
predicates:
  traffic.p.detected:
    profile: committed_reactive/v1
    roles:
      incident: aas:TrafficIncident
      reporter: aas:TrafficRoadVehicle
      participant_a: aas:TrafficRoadVehicle
      participant_b: aas:TrafficRoadVehicle
    expression:
      op: and
      args:
      - op: eq
        args:
        - field: traffic.incident.active
          role: incident
          path: []
        - literal: true
      - op: eq
        args:
        - field: traffic.road.speed_mps
          role: participant_a
          path: []
        - literal: 0.0
      - op: eq
        args:
        - field: traffic.road.speed_mps
          role: participant_b
          path: []
        - literal: 0.0
      - op: eq
        args:
        - field: traffic.road.speed_mps
          role: reporter
          path: []
        - literal: 0.0
      - op: lte
        args:
        - op: distance
          args:
          - field: traffic.road.position_enu_m
            role: reporter
            path: []
          - field: traffic.road.position_enu_m
            role: participant_a
            path: []
        - parameter: detect_radius_m
    parameters:
      detect_radius_m: 20.0
  traffic.p.gap_clear:
    profile: committed_reactive/v1
    roles:
      reporter: aas:TrafficRoadVehicle
    expression:
      op: eq
      args:
      - field: traffic.road.safe_gap
        role: reporter
        path: []
      - literal: true
    parameters: {}
  traffic.p.road_conflict:
    profile: committed_reactive/v1
    roles:
      vehicle: aas:TrafficRoadVehicle
    expression:
      op: gt
      args:
      - op: len
        args:
        - field: traffic.road.blocked_by
          role: vehicle
          path: []
      - literal: 0
    parameters: {}
  traffic.p.medical_locked:
    profile: committed_reactive/v1
    roles:
      task: aas:TrafficTask
    expression:
      op: and
      args:
      - op: eq
        args:
        - field: traffic.task.kind
          role: task
          path: []
        - literal: medical_delivery
      - op: eq
        args:
        - field: traffic.task.interruptible
          role: task
          path: []
        - literal: false
      - op: eq
        args:
        - field: traffic.task.phase
          role: task
          path: []
        - literal: executing
    parameters: {}
  traffic.p.bid_eligible:
    profile: committed_reactive/v1
    roles:
      bid: aas:TrafficBid
      task: aas:TrafficTask
      assessment: aas:TrafficAssessment
      capture_task: aas:TrafficTask
    expression:
      op: and
      args:
      - op: eq
        args:
        - field: traffic.bid.decision_status
          role: bid
          path: []
        - literal: succeeded
      - op: eq
        args:
        - field: traffic.bid.recommendation
          role: bid
          path: []
        - literal: accept
      - op: eq
        args:
        - field: traffic.task.interruptible
          role: task
          path: []
        - literal: true
      - op: eq
        args:
        - field: traffic.assessment.in_region
          role: assessment
          path: []
        - literal: true
      - op: eq
        args:
        - field: traffic.assessment.feasible
          role: assessment
          path: []
        - literal: true
      - op: eq
        args:
        - field: traffic.task.phase
          role: capture_task
          path: []
        - literal: inactive
    parameters: {}
  traffic.p.arrived:
    profile: aerograph_sampled/v1
    roles:
      pose: aas:TrafficUAV
      velocity: aas:TrafficUAV
      task: aas:TrafficTask
    expression:
      op: and
      args:
      - op: lte
        args:
        - op: distance
          args:
          - field: he.aircraft.position_enu_m
            role: pose
            path: []
          - field: traffic.task.target_enu_m
            role: task
            path: []
        - parameter: arrival_radius_m
      - op: lte
        args:
        - op: norm
          args:
          - field: traffic.uav.velocity_enu_mps
            role: velocity
            path: []
        - parameter: stopped_speed_mps
    parameters:
      arrival_radius_m: 1.5
      stopped_speed_mps: 0.5
      dwell_ns: 3000000000
      max_sample_gap_ns: 133333334
  traffic.p.dwell_ready:
    profile: aerograph_sampled/v1
    roles:
      pose: aas:TrafficUAV
      velocity: aas:TrafficUAV
      task: aas:TrafficTask
    expression:
      op: hold
      args:
      - op: and
        args:
        - op: lte
          args:
          - op: distance
            args:
            - field: he.aircraft.position_enu_m
              role: pose
              path: []
            - field: traffic.task.target_enu_m
              role: task
              path: []
          - parameter: arrival_radius_m
        - op: lte
          args:
          - op: norm
            args:
            - field: traffic.uav.velocity_enu_mps
              role: velocity
              path: []
          - parameter: stopped_speed_mps
      - parameter: dwell_ns
      - parameter: max_sample_gap_ns
    parameters:
      arrival_radius_m: 1.5
      stopped_speed_mps: 0.5
      dwell_ns: 3000000000
      max_sample_gap_ns: 2000000000
  traffic.p.capture_accepted:
    profile: committed_reactive/v1
    roles:
      capture: aas:TrafficCapture
      task: aas:TrafficTask
    expression:
      op: and
      args:
      - op: eq
        args:
        - field: traffic.capture.storage_status
          role: capture
          path: []
        - literal: stored
      - op: eq
        args:
        - field: traffic.task.phase
          role: task
          path: []
        - literal: edge_accepted
    parameters: {}
    use: post-storage inspection; completion also requires correlated edge receipt
  traffic.p.capture_active:
    profile: committed_reactive/v1
    roles:
      task: aas:TrafficTask
    expression:
      op: eq
      args:
      - field: traffic.task.phase
        role: task
        path: []
      - literal: assigned
    parameters: {}
  traffic.p.always:
    profile: committed_reactive/v1
    roles: {}
    expression:
      op: eq
      args:
      - literal: true
      - literal: true
    parameters: {}
  traffic.p.interruptible:
    profile: committed_reactive/v1
    roles:
      task: aas:TrafficTask
    expression:
      op: eq
      args:
      - field: traffic.task.interruptible
        role: task
        path: []
      - literal: true
    parameters: {}
  traffic.p.award_busy:
    profile: committed_reactive/v1
    roles:
      task: aas:TrafficTask
    expression:
      op: ne
      args:
      - field: traffic.task.phase
        role: task
        path: []
      - literal: inactive
    parameters: {}
  traffic.p.road_clear:
    profile: committed_reactive/v1
    roles:
      vehicle: aas:TrafficRoadVehicle
    parameters: {}
    expression:
      op: eq
      args:
      - op: len
        args:
        - field: traffic.road.blocked_by
          role: vehicle
          path: []
      - literal: 0
  traffic.p.bids_joined:
    profile: committed_reactive/v1
    roles:
      alpha_bid: aas:TrafficBid
      bravo_bid: aas:TrafficBid
    expression:
      op: and
      args:
      - op: in
        args:
        - field: traffic.bid.decision_status
          role: alpha_bid
          path: []
        - literal:
          - succeeded
          - failed
          - deadline
      - op: in
        args:
        - field: traffic.bid.decision_status
          role: bravo_bid
          path: []
        - literal:
          - succeeded
          - failed
          - deadline
    parameters: {}
  traffic.p.selecting:
    profile: committed_reactive/v1
    roles:
      coordinator: aas:TrafficCoordinator
    expression:
      op: eq
      args:
      - field: traffic.edge.phase
        role: coordinator
        path: []
      - literal: selecting
    parameters: {}
chains:
  traffic.road_follow:
    roles:
      vehicle: aas:TrafficRoadVehicle
      task: aas:TrafficTask
      route: aas:TrafficRoute
    trigger:
      instance: activated
    preconditions: []
    states:
    - initializing
    - following
    - block_pending
    - waiting
    - clear_pending
    - finished
    - failed
    initial: initializing
    terminal:
    - finished
    - failed
    variables: {}
    transition_policy: first_enabled
    transitions:
    - id: start
      from: initializing
      'on':
        instance: activated
      to: following
      priority: 0
      actions:
      - id: follow
        kind: command
        capability: traffic.road.follow
        payload:
          actor:
            $role: vehicle
          route_id:
            $variable: route_id
          progress_m:
            $variable: progress
          stop_progress_m:
            $variable: stop
          speed_mps:
            $variable: speed
          loop:
            $variable: loop
        deadline_ns: 90000000000
      - id: executing
        kind: set
        entity:
          $role: task
        field: traffic.task.phase
        value: executing
    - id: blocked
      from: following
      'on':
        event: traffic.road.blocked
        correlation:
          actor:
            $role: vehicle
      to: block_pending
      priority: 0
      actions:
      - id: stable-block
        kind: delay
        duration_ns: 200000000
    - id: clear
      from: waiting
      'on':
        event: traffic.road.cleared
        correlation:
          actor:
            $role: vehicle
      to: clear_pending
      priority: 0
      actions:
      - id: stable-clear
        kind: delay
        duration_ns: 300000000
    - id: finished
      from: following
      'on':
        receipt: follow
        status: succeeded
      to: finished
      priority: 0
      actions:
      - id: finished
        kind: set
        entity:
          $role: task
        field: traffic.task.phase
        value: completed
    - id: fail-following
      from: following
      'on':
        receipt: follow
        status:
        - failed
        - rejected
        - canceled
      to: failed
      priority: 0
      actions: []
    - id: deadline-following
      from: following
      'on':
        deadline: follow
      to: failed
      priority: 0
      actions: []
    - id: stable-block
      from: block_pending
      'on':
        timer: stable-block
      to: waiting
      priority: 0
      actions:
      - id: waiting
        kind: set
        entity:
          $role: vehicle
        field: traffic.actor.phase
        value: waiting
      guard: traffic.p.road_conflict
    - id: transient-clear
      from: block_pending
      'on':
        event: traffic.road.cleared
        correlation:
          actor:
            $role: vehicle
      to: following
      priority: 0
      actions: []
    - id: reblocked
      from: clear_pending
      'on':
        event: traffic.road.blocked
        correlation:
          actor:
            $role: vehicle
      to: waiting
      priority: 0
      actions: []
    - id: stable-clear
      from: clear_pending
      'on':
        timer: stable-clear
      to: following
      priority: 0
      actions:
      - id: resumed
        kind: set
        entity:
          $role: vehicle
        field: traffic.actor.phase
        value: following
      guard: traffic.p.road_clear
    - id: finish-block_pending
      from: block_pending
      'on':
        receipt: follow
        status: succeeded
      to: finished
      priority: 0
      actions: []
    - id: fail-block_pending
      from: block_pending
      'on':
        receipt: follow
        status:
        - failed
        - rejected
        - canceled
      to: failed
      priority: 0
      actions: []
    - id: timeout-block_pending
      from: block_pending
      'on':
        deadline: follow
      to: failed
      priority: 0
      actions: []
    - id: finish-waiting
      from: waiting
      'on':
        receipt: follow
        status: succeeded
      to: finished
      priority: 0
      actions: []
    - id: fail-waiting
      from: waiting
      'on':
        receipt: follow
        status:
        - failed
        - rejected
        - canceled
      to: failed
      priority: 0
      actions: []
    - id: timeout-waiting
      from: waiting
      'on':
        deadline: follow
      to: failed
      priority: 0
      actions: []
    - id: finish-clear_pending
      from: clear_pending
      'on':
        receipt: follow
        status: succeeded
      to: finished
      priority: 0
      actions: []
    - id: fail-clear_pending
      from: clear_pending
      'on':
        receipt: follow
        status:
        - failed
        - rejected
        - canceled
      to: failed
      priority: 0
      actions: []
    - id: timeout-clear_pending
      from: clear_pending
      'on':
        deadline: follow
      to: failed
      priority: 0
      actions: []
  traffic.uav_routine:
    roles:
      uav: aas:TrafficUAV
      task: aas:TrafficTask
      route: aas:TrafficRoute
    trigger:
      instance: activated
    preconditions: []
    states:
    - ready
    - planning
    - executing
    - suspending
    - suspended
    - failed
    initial: ready
    terminal:
    - suspended
    - failed
    variables: {}
    transition_policy: first_enabled
    transitions:
    - id: next
      from: ready
      'on':
        instance: activated
      to: planning
      priority: 0
      actions:
      - id: next
        kind: command
        capability: traffic.route.next
        payload:
          route:
            $role: route
          index:
            field: traffic.task.route_index
            role: task
        deadline_ns: 90000000000
    - id: leg
      from: planning
      'on':
        receipt: next
        status: succeeded
      to: executing
      priority: 0
      actions:
      - id: next-index
        kind: set
        entity:
          $role: task
        field: traffic.task.route_index
        value:
          $trigger: result.next_index
      - id: leg
        kind: command
        capability: traffic.air.move_to
        payload:
          entity:
            $role: uav
          target:
            $trigger: result.target
        deadline_ns: 90000000000
      - id: executing
        kind: set
        entity:
          $role: task
        field: traffic.task.phase
        value: executing
    - id: fail-planning
      from: planning
      'on':
        receipt: next
        status:
        - failed
        - rejected
        - canceled
      to: failed
      priority: 0
      actions: []
    - id: deadline-planning
      from: planning
      'on':
        deadline: next
      to: failed
      priority: 0
      actions: []
    - id: repeat
      from: executing
      'on':
        receipt: leg
        status: succeeded
      to: planning
      priority: 0
      actions:
      - id: next
        kind: command
        capability: traffic.route.next
        payload:
          route:
            $role: route
          index:
            field: traffic.task.route_index
            role: task
        deadline_ns: 90000000000
    - id: fail-executing
      from: executing
      'on':
        receipt: leg
        status:
        - failed
        - rejected
        - canceled
      to: failed
      priority: 0
      actions: []
    - id: deadline-executing
      from: executing
      'on':
        deadline: leg
      to: failed
      priority: 0
      actions: []
    - id: refuse-medical
      from: executing
      'on':
        event: traffic.broadcast
      to: executing
      priority: 100
      actions:
      - id: locked
        kind: emit
        schema: traffic.bid.joined
        topic: traffic.bid.joined
        payload:
          actor:
            $role: uav
          reason: medical route is noninterruptible
      guard: traffic.p.medical_locked
    - id: suspend
      from: executing
      'on':
        event: traffic.award.proposed
        correlation:
          actor:
            $role: uav
      to: suspending
      priority: 0
      actions:
      - id: stop
        kind: command
        capability: traffic.air.stop
        payload:
          entity:
            $role: uav
        deadline_ns: 90000000000
      guard: traffic.p.interruptible
    - id: fail-suspending
      from: suspending
      'on':
        receipt: stop
        status:
        - failed
        - rejected
        - canceled
      to: failed
      priority: 0
      actions: []
    - id: deadline-suspending
      from: suspending
      'on':
        deadline: stop
      to: failed
      priority: 0
      actions: []
    - id: suspended
      from: suspending
      'on':
        receipt: stop
        status: succeeded
      to: suspended
      priority: 0
      actions:
      - id: suspended
        kind: set
        entity:
          $role: task
        field: traffic.task.phase
        value: suspended
      - id: physical-suspended
        kind: emit
        schema: traffic.award.committed
        topic: traffic.award.committed
        payload:
          actor:
            $role: uav
  traffic.incident_report:
    roles:
      incident: aas:TrafficIncident
      reporter: aas:TrafficRoadVehicle
      participant_a: aas:TrafficRoadVehicle
      participant_b: aas:TrafficRoadVehicle
      capture_task: aas:TrafficTask
    trigger:
      instance: activated
    preconditions: []
    states:
    - inactive
    - staged
    - reporting
    - reported
    - failed
    initial: inactive
    terminal:
    - reported
    - failed
    variables: {}
    transition_policy: first_enabled
    transitions:
    - id: schedule
      from: inactive
      'on':
        instance: activated
      to: inactive
      priority: 0
      actions:
      - id: accident-time
        kind: delay
        duration_ns: 8000000000
    - id: timer
      from: inactive
      'on':
        timer: accident-time
      to: staged
      priority: 0
      actions:
      - id: localise
        kind: set
        entity:
          $role: incident
        field: traffic.incident.position_enu_m
        value:
          field: traffic.road.position_enu_m
          role: participant_a
          path: []
      - id: capture-target
        kind: set
        entity:
          $role: capture_task
        field: traffic.task.target_enu_m
        value:
        - field: traffic.road.position_enu_m
          role: participant_a
          path:
          - 0
        - field: traffic.road.position_enu_m
          role: participant_a
          path:
          - 1
        - field: traffic.task.capture_altitude_m
          role: capture_task
          path: []
      - id: active
        kind: set
        entity:
          $role: incident
        field: traffic.incident.active
        value: true
      - id: phase
        kind: set
        entity:
          $role: incident
        field: traffic.incident.phase
        value: active
      - id: origin
        kind: set
        entity:
          $role: incident
        field: traffic.incident.source_kind
        value: authored_staged
      - id: occurred
        kind: set
        entity:
          $role: incident
        field: traffic.incident.occurred_at
        value:
          ns:
            $now_ns: true
          microstep:
            $microstep: true
      - id: activated
        kind: emit
        schema: traffic.incident.activated
        topic: traffic.incident.activated
        payload:
          incident:
            $role: incident
      - id: stop-participant_a
        kind: command
        capability: traffic.road.stop
        payload:
          actor:
            $role: participant_a
        deadline_ns: 1000000000
      - id: stop-participant_b
        kind: command
        capability: traffic.road.stop
        payload:
          actor:
            $role: participant_b
        deadline_ns: 1000000000
    - id: inject
      from: inactive
      'on':
        event: traffic.inject.accident
        correlation:
          incident:
            $role: incident
      to: staged
      priority: 0
      actions:
      - id: localise
        kind: set
        entity:
          $role: incident
        field: traffic.incident.position_enu_m
        value:
          field: traffic.road.position_enu_m
          role: participant_a
          path: []
      - id: capture-target
        kind: set
        entity:
          $role: capture_task
        field: traffic.task.target_enu_m
        value:
        - field: traffic.road.position_enu_m
          role: participant_a
          path:
          - 0
        - field: traffic.road.position_enu_m
          role: participant_a
          path:
          - 1
        - field: traffic.task.capture_altitude_m
          role: capture_task
          path: []
      - id: active
        kind: set
        entity:
          $role: incident
        field: traffic.incident.active
        value: true
      - id: phase
        kind: set
        entity:
          $role: incident
        field: traffic.incident.phase
        value: active
      - id: origin
        kind: set
        entity:
          $role: incident
        field: traffic.incident.source_kind
        value: operator
      - id: occurred
        kind: set
        entity:
          $role: incident
        field: traffic.incident.occurred_at
        value:
          ns:
            $now_ns: true
          microstep:
            $microstep: true
      - id: activated
        kind: emit
        schema: traffic.incident.activated
        topic: traffic.incident.activated
        payload:
          incident:
            $role: incident
      - id: stop-participant_a
        kind: command
        capability: traffic.road.stop
        payload:
          actor:
            $role: participant_a
        deadline_ns: 1000000000
      - id: stop-participant_b
        kind: command
        capability: traffic.road.stop
        payload:
          actor:
            $role: participant_b
        deadline_ns: 1000000000
    - id: detect
      from: staged
      'on':
        predicate: traffic.p.detected
        edge: entered
      to: reporting
      priority: 0
      actions:
      - id: detected
        kind: emit
        schema: traffic.incident.detected
        topic: traffic.incident.detected
        payload:
          incident:
            $role: incident
          actor:
            $role: reporter
    - id: report
      from: reporting
      'on':
        event: traffic.report.sent
      to: reported
      priority: 0
      actions: []
    - id: decision-failure
      from: reporting
      'on':
        event: traffic.decision.failed
      to: failed
      priority: 0
      actions: []
  traffic.reporter_departure:
    roles:
      reporter: aas:TrafficRoadVehicle
      route: aas:TrafficRoute
    trigger:
      event: traffic.report.sent
    preconditions: []
    states:
    - waiting_gap
    - retry_wait
    - bypassing
    - network_continuing
    - failed
    initial: waiting_gap
    terminal:
    - failed
    variables: {}
    transition_policy: first_enabled
    transitions:
    - id: borrow
      from: waiting_gap
      'on':
        predicate: traffic.p.gap_clear
        edge: while
      to: bypassing
      priority: 0
      actions:
      - id: bypass
        kind: command
        capability: traffic.road.bypass
        payload:
          actor:
            $role: reporter
          route_id: adjacent_lane_bypass
          progress_m: 0.0
          stop_progress_m:
            $variable: bypass_length
          speed_mps: 5.5
          loop: false
        deadline_ns: 90000000000
      guard: traffic.p.gap_clear
    - id: continue
      from: bypassing
      'on':
        receipt: bypass
        status: succeeded
      to: network_continuing
      priority: 0
      actions:
      - id: network
        kind: command
        capability: traffic.road.follow
        payload:
          actor:
            $role: reporter
          route_id:
            $variable: network_route
          progress_m:
            $variable: network_progress
          stop_progress_m:
            $variable: network_length
          speed_mps: 6.0
          loop: true
        deadline_ns: 90000000000
    - id: fail-bypassing
      from: bypassing
      'on':
        receipt: bypass
        status:
        - failed
        - canceled
      to: failed
      priority: 0
