      relation: traffic.actor-route
      source_role: vehicle
      target_role: route
  variables:
    route_id:
      field: traffic.road.route_id
      role: vehicle
    progress:
      field: traffic.task.motion
      role: task
      path:
      - progress_m
    stop:
      field: traffic.task.motion
      role: task
      path:
      - stop_progress_m
    speed:
      field: traffic.task.motion
      role: task
      path:
      - speed_mps
    loop:
      field: traffic.task.motion
      role: task
      path:
      - loop
