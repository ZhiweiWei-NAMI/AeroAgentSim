entities: []
bindings:
  rules:
  - writer: traffic
    type: e1:RoadVehicle
    fields:
    - e1.sumo.vehicle.position
    - e1.sumo.vehicle.speed
    - e1.sumo.vehicle.route
    ids: vehicle/*
  - writer: traffic
    type: e1:Person
    fields:
    - e1.sumo.person.position
    - e1.sumo.person.speed
    ids: person/*
  - writer: traffic
    type: e1:TrafficLight
    fields:
    - e1.sumo.tls.state
    - e1.sumo.tls.phase
    - e1.sumo.tls.program
    ids: tls/*
  lifecycle:
  - controller: traffic
    type: e1:RoadVehicle
    ids: vehicle/*
  - controller: traffic
    type: e1:Person
    ids: person/*
  - controller: traffic
    type: e1:TrafficLight
    ids: tls/*
  commands:
  - schema: adapters.sumo.reroute
    target: traffic
    at_ns: 5000000000
    payload:
      vehicle: v0
engines:
  traffic:
    plugin: sumo
    config:
      image: aeroagentsim/sumo:dev
      host: 127.0.0.1
      port: 19002
      step_ns: 100000000
      clock_id: sumo.simulation
      mapping_id: sumo.elapsed/v1
      event_topic: native-events
      kinds:
        vehicle:
          type_id: e1:RoadVehicle
          prefix: vehicle/
          fields:
            position: e1.sumo.vehicle.position
            speed: e1.sumo.vehicle.speed
            route: e1.sumo.vehicle.route
        person:
          type_id: e1:Person
          prefix: person/
          fields:
            position: e1.sumo.person.position
            speed: e1.sumo.person.speed
        tls:
          type_id: e1:TrafficLight
          prefix: tls/
          fields:
            state: e1.sumo.tls.state
            phase: e1.sumo.tls.phase
            program: e1.sumo.tls.program
      reset:
        scenario:
          kind: grid
          vehicles: 50
          persons: 3
          depart_interval_s: 0.1
clock_mappings:
- clock_id: canonical
  mapping_id: canonical
- clock_id: sumo.simulation
  mapping_id: sumo.elapsed/v1
run:
  seed: 42
  until_ns: 60000000000
  advance_ns: 1000000000
  pacing: fast
outputs:
  durability: flush
