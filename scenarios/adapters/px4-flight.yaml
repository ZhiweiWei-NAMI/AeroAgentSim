format: aeroagentsim.scenario/v1
id: e1-px4-flight
registry:
  snapshot: authored-registry.json
  types:
  - id: e1:Aircraft
    parents: []
    abstract: false
  fields:
  - id: e1.px4.position
    type: e1:Aircraft
    schema: &id001
      type: vector
      items: &id002
        type: number
      length: 3
    metadata:
      role: observation
      time_semantics: backend boundary observation; MAVSDK source acquisition unavailable
      frame: enu
  - id: e1.px4.velocity
    type: e1:Aircraft
    schema: *id001
    metadata:
      role: observation
      time_semantics: backend boundary observation; MAVSDK source acquisition unavailable
      frame: enu
  - id: e1.px4.attitude
    type: e1:Aircraft
    schema:
      type: vector
      items: *id002
      length: 4
    metadata:
      role: observation
      time_semantics: backend boundary observation; MAVSDK source acquisition unavailable
      frame: enu
  - id: e1.px4.battery
    type: e1:Aircraft
    schema:
      type: record
      members:
        remaining_fraction: *id002
        voltage_v: *id002
      required:
      - remaining_fraction
      - voltage_v
      extra: false
    metadata:
      role: observation
      time_semantics: backend boundary observation; MAVSDK source acquisition unavailable
  - id: e1.px4.armed
    type: e1:Aircraft
    schema:
      type: boolean
    metadata:
      role: observation
      time_semantics: backend boundary observation; MAVSDK source acquisition unavailable
  - id: e1.px4.mode
    type: e1:Aircraft
    schema: &id003
      type: string
    metadata:
      role: observation
      time_semantics: backend boundary observation; MAVSDK source acquisition unavailable
  - id: e1.px4.landed
    type: e1:Aircraft
    schema: *id003
    metadata:
      role: observation
      time_semantics: backend boundary observation; MAVSDK source acquisition unavailable
  messages:
  - id: adapters.px4_gazebo.arm
    kind: command
    schema:
      type: record
      members:
        entity:
          type: string
          min_length: 1
      required:
      - entity
      extra: false
    result_schema:
      type: record
      members:
        command_id:
          type: string
          min_length: 1
        vehicle:
          type: string
          min_length: 1
        action:
          type: string
          min_length: 1
        status:
          type: string
          enum:
          - accepted
          - rejected
          - queued
          - running
          - executing
          - succeeded
          - failed
        sim_ns:
          type: integer
          minimum: 0
        reason:
          type: string
          min_length: 1
        observation:
          type: record
          members: {}
          required: []
          extra: false
        packet_id:
          type: string
          min_length: 1
        src:
          type: string
          min_length: 1
        dst:
          type: string
          min_length: 1
        sent_ns:
          type: integer
          minimum: 0
        received_ns:
          type: integer
          minimum: 0
        available_sim_ns:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        payload_ref:
          type: string
          min_length: 1
        rssi_dbm:
          type: number
        snr_db:
          type: number
        available_ns:
          type: integer
          minimum: 0
      required: []
      extra: false
  - id: adapters.px4_gazebo.disarm
    kind: command
    schema:
      type: record
      members:
        entity:
          type: string
          min_length: 1
      required:
