entities:
- id: aircraft
  type: e1:Aircraft
  facts: {}
bindings:
  rules:
  - writer: flight
    type: e1:Aircraft
    fields:
    - e1.px4.position
    - e1.px4.velocity
    - e1.px4.attitude
    - e1.px4.battery
    - e1.px4.armed
    - e1.px4.mode
    - e1.px4.landed
  lifecycle:
  - controller: flight
    type: e1:Aircraft
  commands: []
engines:
  flight:
    plugin: px4_gazebo
    config:
      image: aeroagentsim/px4-gazebo:dev-p2b
      host: 127.0.0.1
      port: 19001
      step_ns: 200000000
      clock_id: px4.observation
      pose_clock_id: gazebo.simulation
      pose_mapping_id: gazebo.warmup/v1
      mapping_id: px4.elapsed/v1
      event_topic: native-events
      vehicles:
        aircraft: u1
      fields:
        position: e1.px4.position
        velocity: e1.px4.velocity
        attitude: e1.px4.attitude
        battery: e1.px4.battery
        armed: e1.px4.armed
        mode: e1.px4.mode
        landed: e1.px4.landed
      reset:
        world: default
        warmup: 10000000000
        vehicles:
        - id: u1
          model: x500
          spawn:
          - 0
          - 0
          - 0.2
          - 0
          - 0
          - 0
clock_mappings:
- clock_id: canonical
  mapping_id: canonical
- clock_id: px4.observation
  mapping_id: px4.elapsed/v1
- clock_id: gazebo.simulation
  mapping_id: gazebo.warmup/v1
  offset_ns: -10000000000
run:
  seed: 42
  until_ns: 100000000000
  advance_ns: 1000000000
  pacing: fast
outputs:
  durability: flush
