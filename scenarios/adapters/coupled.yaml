    schema:
      type: record
      members:
        xy:
          type: vector
          items: *id002
          length: 2
      required:
      - xy
      extra: false
    metadata:
      role: observation
      frame: sumo-network-xy
  - id: e1.sumo.vehicle.speed
    type: e1:RoadVehicle
    schema: *id002
    metadata:
      role: observation
      frame: scalar
  - id: e1.sumo.vehicle.route
    type: e1:RoadVehicle
    schema:
      type: array
      items: *id003
    metadata:
      role: observation
      frame: scalar
  - id: e1.sumo.person.position
    type: e1:Person
