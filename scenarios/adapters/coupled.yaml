format: aeroagentsim.scenario/v1
id: e1-coupled
registry:
  snapshot: authored-registry.json
  types:
  - id: e1:Aircraft
    parents: []
    abstract: false
  - id: e1:RoadVehicle
    parents: []
    abstract: false
  - id: e1:Person
    parents: []
    abstract: false
  - id: e1:TrafficLight
    parents: []
    abstract: false
  fields:
  - id: e1.px4.position
    type: e1:Aircraft
    schema: &id001
      type: vector
      items: &id002
        type: number
      length: 3
    metadata:
      role: observation
      time_semantics: backend boundary observation; MAVSDK source acquisition unavailable
      frame: enu
  - id: e1.px4.velocity
    type: e1:Aircraft
    schema: *id001
    metadata:
      role: observation
      time_semantics: backend boundary observation; MAVSDK source acquisition unavailable
      frame: enu
  - id: e1.px4.attitude
    type: e1:Aircraft
    schema:
      type: vector
      items: *id002
      length: 4
    metadata:
      role: observation
      time_semantics: backend boundary observation; MAVSDK source acquisition unavailable
      frame: enu
  - id: e1.px4.battery
    type: e1:Aircraft
    schema:
      type: record
      members:
        remaining_fraction: *id002
        voltage_v: *id002
      required:
      - remaining_fraction
      - voltage_v
      extra: false
    metadata:
      role: observation
      time_semantics: backend boundary observation; MAVSDK source acquisition unavailable
  - id: e1.px4.armed
    type: e1:Aircraft
    schema:
      type: boolean
    metadata:
      role: observation
      time_semantics: backend boundary observation; MAVSDK source acquisition unavailable
  - id: e1.px4.mode
