engines:
  flight:
    plugin: px4_gazebo
    config:
      image: aeroagentsim/px4-gazebo:dev
      host: 127.0.0.1
      port: 19001
      step_ns: 200000000
      clock_id: px4.observation
      pose_clock_id: gazebo.simulation
      pose_mapping_id: gazebo.warmup/v1
      mapping_id: px4.elapsed/v1
      event_topic: native-events
      vehicles:
        aircraft: u1
      fields:
        position: e1.px4.position
        velocity: e1.px4.velocity
        attitude: e1.px4.attitude
        battery: e1.px4.battery
        armed: e1.px4.armed
        mode: e1.px4.mode
        landed: e1.px4.landed
      reset:
        world: default
        warmup: 10000000000
        vehicles:
        - id: u1
          model: x500
          spawn:
          - 0
          - 0
          - 0.2
          - 0
          - 0
          - 0
  traffic:
    plugin: sumo
    config:
      image: aeroagentsim/sumo:dev
      host: 127.0.0.1
      port: 19002
      step_ns: 100000000
      clock_id: sumo.simulation
      mapping_id: sumo.elapsed/v1
      event_topic: native-events
      kinds:
        vehicle:
          type_id: e1:RoadVehicle
          prefix: vehicle/
          fields:
            position: e1.sumo.vehicle.position
            speed: e1.sumo.vehicle.speed
            route: e1.sumo.vehicle.route
        person:
          type_id: e1:Person
          prefix: person/
          fields:
            position: e1.sumo.person.position
            speed: e1.sumo.person.speed
        tls:
          type_id: e1:TrafficLight
          prefix: tls/
          fields:
            state: e1.sumo.tls.state
            phase: e1.sumo.tls.phase
            program: e1.sumo.tls.program
      reset:
        scenario:
          kind: grid
          vehicles: 50
          persons: 3
          depart_interval_s: 0.1
  radio:
    plugin: ns3
    config:
      image: aeroagentsim/ns3:dev
      host: 127.0.0.1
      port: 19003
      step_ns: 200000000
      clock_id: ns3.simulation
      mapping_id: ns3.elapsed/v1
      event_topic: native-events
      consumer_lag_ns: 200000000
      mobility:
      - entity: aircraft
        field: e1.px4.position
        node: uav
      reset:
        nodes:
        - id: uav
          position_enu:
          - 0
          - 0
          - 0.2
        - id: ground
          position_enu:
          - 20
          - 0
          - 0
clock_mappings:
- clock_id: canonical
  mapping_id: canonical
- clock_id: px4.observation
  mapping_id: px4.elapsed/v1
- clock_id: gazebo.simulation
  mapping_id: gazebo.warmup/v1
  offset_ns: -10000000000
- clock_id: sumo.simulation
  mapping_id: sumo.elapsed/v1
- clock_id: ns3.simulation
  mapping_id: ns3.elapsed/v1
run:
  seed: 42
  until_ns: 30000000000
  advance_ns: 1000000000
  pacing: fast
outputs:
  durability: flush
