      points:
      - timer_ns: 1000000000
      - timer_ns: 8000000000
      - timer_ns: 15000000000
      - timer_ns: 22000000000
      - timer_ns: 30000000000
      - timer_ns: 45000000000
      - timer_ns: 55000000000
      budget:
        wall_timeout_s: 60
        max_rounds: 3
        max_calls: 10
