          acknowledged:
            on_enter:
            - kind: emit
              schema: aas.business.accepted
              topic: business-acceptance
              payload:
                machine: order-2
            transitions: []
      - entity: order-3
        field: aas.p1.acceptance_state
        initial: pending
        states:
          pending:
            transitions:
            - to: reviewing
