  zz_decision:
    plugin: decision
    config:
      instruction: Dispatch authored submitted orders to available resources. Each
        order has aas.agent.destination and each resource has aas.agent.available.
        Assign as many submitted orders as available resources, at most five assignments
        per decision. Use aas.agent.assign once per order/resource pair. Never reuse
        an order or resource in a decision. entity is order ID, resource is UAV ID,
        target is the exact order destination. Await actual receipts for completion.
        If no assignment is possible call noop. Include a short decision_summary on
        every call.
      grants:
        fields:
        - entity: uav-1
          field: aas.agent.available
        - entity: uav-1
          field: he.aircraft.position_enu_m
        - entity: uav-2
          field: aas.agent.available
        - entity: uav-2
