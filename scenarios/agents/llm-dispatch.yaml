bindings:
  rules:
  - writer: motion
    type: oo:UAV
    fields:
    - he.aircraft.position_enu_m
    - aas.p1.velocity_enu_m_s
    - aas.p1.energy_j
  - writer: operations
    type: oo:Order
    fields:
    - aas.p1.order_state
  - writer: observations
    type: aas:KinematicObservation
    fields:
    - oo:shared.observationRecord.acquisitionTime
    - oo:shared.observationRecord.availableTime
    - oo:shared.observationRecord.observedSubjectRef
    - aas.p1.position_sample
  - writer: acceptance
    type: oo:Order
    fields:
    - aas.p1.acceptance_state
  - writer: operations
    type: oo:UAV
    fields:
    - aas.agent.available
  - writer: operations
    type: oo:Order
    fields:
    - aas.agent.destination
  lifecycle:
  - controller: motion
    type: oo:UAV
  - controller: operations
    type: oo:Order
  - controller: observations
    type: aas:KinematicObservation
    ids: obs/*
  relations:
  - writer: observations
    relation: oo:relation:observation-subject
    type: aas:KinematicObservation
    ids: obs/*
  obligations:
  - controller: observations
    relation: oo:relation:observation-subject
    direction: targets_per_source
    type: aas:KinematicObservation
    ids: obs/*
  samples: []
engines:
  motion:
    plugin: kinematic
    config:
      type_id: oo:UAV
      position_field: he.aircraft.position_enu_m
      velocity_field: aas.p1.velocity_enu_m_s
      energy_field: aas.p1.energy_j
      step_ns: 100000000
      frame:
        convention: enu
        unit: m
        transform_revision: p1-local-1
      max_speed_m_s: 10.0
      max_accel_m_s2: 5.0
      energy:
        capacity_j: 100000.0
        idle_w: 20.0
        per_m_j: 5.0
      commands:
        move_to: aas.motion.move_to
        hold: aas.motion.hold
        stop: aas.motion.stop
      arrival_schema: aas.motion.arrived
      arrival_topic: arrival
      lifecycle: true
      model: enu_point_mass
      arrival_payload:
        entity: $entity
        position: $position
        machine: $payload.machine
      result_fields:
        entity: entity
        position: position
        reason: reason
  operations:
    plugin: agent-assignment
    config:
      state_field: aas.p1.order_state
      availability_field: aas.agent.available
      destination_field: aas.agent.destination
      assign_schema: aas.agent.assign
      move_schema: aas.motion.move_to
      motion_target: motion
      arrival_schema: aas.motion.arrived
      acceptance_schema: aas.business.accepted
      arrival_topic: arrival
      acceptance_topic: business-acceptance
  observations:
    plugin: records
    config:
      trigger_schema: aas.motion.arrived
      topic: arrival
      subject_key: entity
      position_field: he.aircraft.position_enu_m
      type_id: aas:KinematicObservation
      acquired_field: oo:shared.observationRecord.acquisitionTime
      available_field: oo:shared.observationRecord.availableTime
      subject_field: oo:shared.observationRecord.observedSubjectRef
      sample_field: aas.p1.position_sample
      release_delay_ns: 20000000
      relation_id: oo:relation:observation-subject
  acceptance:
    plugin: workflow
    config:
      produces:
      - aas.p1.acceptance_state
      consumes: []
      emits:
      - aas.business.accepted
      subscribes:
      - arrival
      targets:
      - business-acceptance
      lifecycle: false
      machines:
      - entity: order-1
        field: aas.p1.acceptance_state
        initial: pending
        states:
          pending:
            transitions:
            - to: reviewing
              event: aas.motion.arrived
          reviewing:
            transitions:
            - to: acknowledged
              timer_ns: 100000000
          acknowledged:
            on_enter:
            - kind: emit
              schema: aas.business.accepted
              topic: business-acceptance
              payload:
                machine: order-1
            transitions: []
      - entity: order-2
        field: aas.p1.acceptance_state
        initial: pending
