format: aeroagentsim.scenario/v1
id: llm-dispatch
registry:
  types:
  - id: aas:KinematicObservation
    parents:
    - oo:MetricObservation
    abstract: false
  fields:
  - id: aas.p1.velocity_enu_m_s
    type: oo:UAV
    schema: &id001
      type: vector
      items:
        type: number
      length: 3
    metadata:
      unit: m/s
      frame: enu
      role: derived
      clock: canonical
  - id: aas.p1.energy_j
    type: oo:UAV
    schema:
      type: number
    metadata:
      unit: J
      role: derived
      clock: canonical
  - id: aas.p1.order_state
    type: oo:Order
    schema:
      type: string
      enum:
      - submitted
      - executing
      - awaiting_acceptance
      - accepted
      - failed
      - canceled
    metadata:
      role: state
      clock: canonical
  - id: aas.p1.position_sample
    type: aas:KinematicObservation
    schema: *id001
    metadata:
      unit: m
      frame: enu
      role: observation
      clock: canonical
  - id: aas.p1.acceptance_state
    type: oo:Order
    schema:
      type: string
      enum:
      - pending
      - reviewing
      - acknowledged
    metadata:
      role: state
      clock: canonical
  - id: aas.agent.available
    type: oo:UAV
    schema:
      type: boolean
    metadata:
      role: state
      clock: canonical
  - id: aas.agent.destination
    type: oo:Order
    schema: &id006
      type: vector
      items:
        type: number
      length: 3
    metadata:
      unit: m
      frame: enu
      role: configuration
      clock: canonical
  messages:
  - id: aas.motion.move_to
    kind: command
    schema:
      type: record
      members:
        entity: &id002
          type: string
        machine: *id002
        target: *id001
        subject:
          type: ref
          target_type: oo:UAV
      required:
      - entity
      - machine
      - target
      extra: false
    result_schema: &id003
      type: record
      members:
        entity: *id002
        position: *id001
        reason: *id002
      required: []
      extra: false
    feedback_schema: *id003
    cancel_support: true
  - id: aas.motion.hold
    kind: command
    schema: &id004
      type: record
      members:
        entity: *id002
        machine: *id002
        subject:
          type: ref
          target_type: oo:UAV
      required:
      - entity
      - machine
      extra: false
    result_schema: *id003
    feedback_schema: *id003
    cancel_support: true
  - id: aas.motion.stop
    kind: command
    schema: *id004
    result_schema: *id003
    feedback_schema: *id003
    cancel_support: true
  - id: aas.motion.arrived
    kind: event
    schema:
      type: record
      members:
        entity: *id002
        machine: *id002
        position: *id001
      required:
      - entity
      - machine
      - position
      extra: false
  - id: aas.business.accepted
    kind: event
    schema:
      type: record
      members:
        machine: *id002
      required:
      - machine
      extra: false
  - id: aas.p1.reached_x
    kind: event
    schema:
      type: record
      members:
        entity: *id002
        from_ns: &id005
          type: integer
        to_ns: *id005
      required:
      - entity
      - from_ns
      - to_ns
      extra: false
  - id: aas.agent.record
    kind: event
    schema:
      type: record
      members:
        decision_id:
          type: string
        phase:
          type: string
          enum:
          - observation
          - prompt
          - response
          - validation
          - command
          - failure
          - finished
          - receipt
        data_json:
          type: string
        code:
          type: string
          nullable: true
          enum:
          - null
          - WALL_TIMEOUT
          - TRANSPORT
          - PROTOCOL
          - HTTP_STATUS
          - TOKEN_BUDGET
          - CALL_BUDGET
          - PROMPT_BUDGET
          - RETRY_BUDGET
          - ROUND_BUDGET
          - USAGE_MISSING
          - NO_TOOL_CALLS
          - TOOL_REJECTED
          - MALFORMED_CALL_ID
      required:
      - decision_id
      - phase
      - data_json
      - code
      extra: false
  - id: aas.agent.assign
    kind: command
    schema:
      type: record
      members:
        entity:
          type: string
        resource:
          type: string
        target: *id006
      required:
      - entity
      - resource
      - target
      extra: false
    result_schema: &id007
      type: record
      members:
        reason:
          type: string
        entity:
          type: string
      required: []
      extra: false
    feedback_schema: *id007
    cancel_support: false
  relations:
  - id: oo:relation:observation-subject
    source_type: oo:ObservationRecord
    target_type: oo:ModelObject
    targets_per_source:
      minimum: 1
      maximum: 1
    sources_per_target:
      minimum: 0
      maximum: null
    identity_policy: edge_id
    metadata:
      inverse_policy: authored unconstrained many records per subject; source declares
        no inverse direction
      reviewStatus: proposed
  field_metadata:
    he.aircraft.position_enu_m:
      frame: enu
      transform_revision: p1-local-1
  snapshot: ../registry/motion.snapshot.json
