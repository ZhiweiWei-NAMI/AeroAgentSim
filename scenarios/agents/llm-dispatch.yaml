        - entity: order-8
          field: aas.agent.destination
        - entity: order-9
          field: aas.p1.order_state
        - entity: order-9
          field: aas.agent.destination
        - entity: order-10
          field: aas.p1.order_state
        - entity: order-10
          field: aas.agent.destination
        relations: []
        events: []
        commands:
        - schema: aas.agent.assign
          target: operations
          allowed:
            entity:
            - order-1
            - order-2
            - order-3
            - order-4
            - order-5
            - order-6
            - order-7
            - order-8
            - order-9
            - order-10
