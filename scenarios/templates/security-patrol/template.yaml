format: aeroagentsim.template/v1
city: huangpu
id: security-patrol
title: Security patrol
title_zh: 安防巡逻
summary: A drone patrols a district and responds when an operator reports an incident.
summary_zh: 无人机巡逻街区，并响应操作员上报的事件。
category: security
difficulty: beginner
duration_s: 300
scenario: scenario.yaml
observe:
- The drone visits each patrol point.
- An operator incident creates a higher-priority investigation.
observe_zh:
- 无人机依次到访各个巡逻点。
- 操作员上报事件后，生成优先级更高的调查任务。
try:
- Add patrol drones to reduce the investigation wait.
- Change the wind speed.
try_zh:
- 增加巡逻无人机，缩短调查任务的等待时间。
- 调整风速。
knobs:
- id: fleet_size
  label: Number of aircraft
  label_zh: 飞行器数量
  type: integer
  default: 1
  min: 1
  max: 12
  pointer: /generators/fleet/count
- id: wind_speed
  label: Normal wind speed (m/s)
  label_zh: 常态风速（米/秒）
  type: number
  default: 2.0
  min: 0
  max: 15
  pointer: /engines/environment/config/profiles/weather/lowalt.wind/value/0
- id: battery_reserve
  label: Battery reserve (%)
  label_zh: 预留电量（%）
  type: number
  default: 20
  min: 10
  max: 85
  pointer: /behaviours/0/predicates/battery_below_reserve/parameters/reserve_percent
- id: safety_distance
  label: Safety distance (m)
  label_zh: 安全间隔（米）
  type: number
  default: 20
  min: 5
  max: 60
  pointer: /behaviours/0/predicates/closer_than_safety_distance/parameters/horizontal_m
- id: wind_limit
  label: Wind limit (m/s)
  label_zh: 风速上限（米/秒）
  type: number
  default: 12
  min: 2
  max: 20
  pointer: /behaviours/0/predicates/wind_above_limit/parameters/patrol_limit_mps
kpis:
- tasks_completed
- mean_task_latency_s
- energy_used_kj
- weather_holds
- separation_conflicts
- patrol_visits
thumbnail: thumbnail.png
