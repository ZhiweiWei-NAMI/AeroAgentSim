format: aeroagentsim.template/v1
city: huangpu
id: traffic-accident
title: Traffic accident response
title_zh: 交通事故响应
summary: Nearby drones assess an accident, choose a responder and upload a city-camera image.
summary_zh: 附近的无人机评估事故、选出响应机，并上传城市相机拍摄的现场图像。
category: emergency
difficulty: beginner
duration_s: 90
scenario: ../../demos/traffic-accident/scenario.yaml
observe:
  - Watch the accident report trigger bids from nearby drones.
  - See the selected drone reach the incident and upload its camera image.
  - Compare response time and energy after changing the settings.
observe_zh:
  - 观察事故报告如何触发附近无人机竞标。
  - 查看获选无人机到达现场并上传相机图像的过程。
  - 调整参数后，对比响应时间和能耗。
try:
  - Choose interactive mode, set the accident time to 30 seconds, then select incident.01 and inject accident before the scheduled timer. Follow Why? through dispatch and open the stored photo.
  - Move the accident earlier or later in the run.
  - Increase the physics update rate.
  - Use a configured live model for the response decisions.
try_zh:
  - 选择实时交互，将事故时间设为 30 秒；启动后选择 incident.01，在定时事故前注入 accident。在“为什么？”中追踪派遣，再打开已存储的现场照片。
  - 提前或推迟事故发生时间。
  - 提高物理状态的更新频率。
  - 配置实时模型，让模型参与响应决策。
knobs:
  - id: run_mode
    label: Run mode
    label_zh: 运行方式
    type: choice
    default: scheduled
    options: [scheduled, interactive]
    options_zh: [自动运行（无需人工推进）, 实时交互（控制台推进与注入）]
    description: Interactive mode opens the operator input source. The authored accident timer remains; inject before it fires.
    description_zh: 实时交互开启操作员输入源，原定时事故仍保留；请在定时器触发前注入。
    apply: lowalt.operator_mode
  - id: accident_time_s
    label: Accident time (seconds)
    label_zh: 事故发生时间（秒）
    type: number
    default: 8
    min: 0.1
    max: 30
    apply: traffic.accident_time
  - id: decision_mode
    label: Response decisions
    label_zh: 响应决策模式
    type: choice
    default: scripted
    options: [scripted, live]
    options_zh: [预设决策, 实时模型]
    apply: traffic.decision_mode
  - id: physics_hz
    label: Physics updates per second
    label_zh: 物理更新频率（次/秒）
    type: number
    default: 1
    min: 0.5
    max: 20
    apply: traffic.physics_hz
kpis: [tasks_completed, mean_task_latency_s, energy_used_kj, distance_flown_km, accident_reported, captures_stored, uploads_accepted]
thumbnail: thumbnail.png
