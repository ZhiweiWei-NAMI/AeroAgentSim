format: aeroagentsim.template/v1
city: huangpu
id: medical-delivery
title: Urgent medical delivery
title_zh: 紧急医疗配送
summary: Drones pause routine deliveries to carry urgent supplies from a hospital
  to a clinic.
summary_zh: 无人机暂停常规配送，优先将紧急医疗物资从医院送往诊所。
category: emergency
difficulty: beginner
duration_s: 300
scenario: scenario.yaml
observe:
- An urgent request pauses a parcel delivery, then the parcel resumes.
- Watch how quickly supplies reach the clinic.
observe_zh:
- 紧急请求打断包裹配送，处理完毕后再恢复原任务。
- 观察医疗物资多久能送达诊所。
try:
- Add drones to reduce the wait for urgent supplies.
- Compare nearest and auction allocation.
try_zh:
- 增加无人机，缩短紧急物资的等待时间。
- 对比就近分配与竞价分配。
knobs:
- id: fleet_size
  label: Number of aircraft
  label_zh: 飞行器数量
  type: integer
  default: 6
  min: 1
  max: 12
  pointer: /generators/fleet/count
- id: order_rate
  label: Routine parcel orders per second
  label_zh: 每秒常规包裹订单数
  type: number
  default: 0.06
  min: 0.005
  max: 1
  pointer: /engines/tasks/config/generators/0/arrivals/rate_per_s
- id: wind_speed
  label: Normal wind speed (m/s)
  label_zh: 常态风速（米/秒）
  type: number
  default: 2.0
  min: 0
  max: 15
  pointer: /engines/environment/config/profiles/weather/lowalt.wind/value/0
- id: allocator
  label: Task allocation algorithm
  label_zh: 任务分配算法
  type: choice
  default: nearest
  options:
  - nearest
  - auction
  - hungarian
  - llm
  pointer: /algorithms/allocation
- id: battery_reserve
  label: Battery reserve (%)
  label_zh: 预留电量（%）
  type: number
  default: 20
  min: 10
  max: 85
  pointer: /behaviours/0/predicates/battery_below_reserve/parameters/reserve_percent
- id: safety_distance
  label: Safety distance (m)
  label_zh: 安全间隔（米）
  type: number
  default: 20
  min: 5
  max: 60
  pointer: /behaviours/0/predicates/closer_than_safety_distance/parameters/horizontal_m
- id: wind_limit
  label: Wind limit (m/s)
  label_zh: 风速上限（米/秒）
  type: number
  default: 12
  min: 2
  max: 20
  pointer: /behaviours/0/predicates/wind_above_limit/parameters/parcel_limit_mps
kpis:
- tasks_completed
- mean_task_latency_s
- energy_used_kj
- weather_holds
- separation_conflicts
- medical_mean_task_latency_s
- medical_p95_task_latency_s
thumbnail: thumbnail.png
