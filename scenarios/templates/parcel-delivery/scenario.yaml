bindings:
  rules:
  - writer: motion
    type: lowalt:UAV
    fields:
    - lowalt.position
    - lowalt.velocity
  - writer: energy
    type: lowalt:UAV
    fields:
    - lowalt.soc
    - lowalt.charging
    - lowalt.energy_used_j
    - lowalt.distance_m
    - lowalt.motion_energy_j
  - writer: airspace
    type: lowalt:UAV
    fields:
    - lowalt.membership
    - lowalt.conflicts
    - lowalt.weather_held
  - writer: tasks
    type: lowalt:UAV
    fields:
    - lowalt.capacity_j
    - lowalt.payload_kg
    - lowalt.payload_capacity_kg
    - lowalt.vehicle_class
  - writer: tasks
    type: lowalt:Site
    fields:
    - lowalt.site_position
    - lowalt.site_open
    - lowalt.site_capacity
  - writer: tasks
    type: lowalt:ChargingPad
    fields:
    - lowalt.pad_power_w
  - writer: tasks
    type: lowalt:Task
    fields:
    - lowalt.task_state
    - lowalt.task_kind
    - lowalt.task_priority
    - lowalt.task_origin
    - lowalt.task_destination
    - lowalt.task_created_ns
    - lowalt.task_vehicle
    - lowalt.task_payload_kg
  - writer: tasks
    type: lowalt:AirspaceZone
    fields:
    - lowalt.zone_kind
    - lowalt.zone_lower
    - lowalt.zone_upper
    - lowalt.zone_start_ns
    - lowalt.zone_end_ns
    - lowalt.zone_dynamic
  - writer: airspace
    type: lowalt:AirspaceZone
    fields:
    - lowalt.zone_active
  - writer: environment
    type: lowalt:Environment
    fields:
    - lowalt.wind
  lifecycle:
  - controller: tasks
    type: lowalt:UAV
  - controller: tasks
    type: lowalt:Site
  - controller: tasks
    type: lowalt:AirspaceZone
  - controller: tasks
    type: lowalt:Task
  - controller: environment
    type: lowalt:Environment
  commands: []
algorithms:
  allocation: nearest
  path_planning: corridor_astar
  conflict_resolution: altitude_layers
  charging: threshold_return
generators:
  fleet:
    count: 6
    prefix: drone-
    type: lowalt:UAV
    starts:
    - *id008
    - *id009
    spacing_m: 1.0
    facts:
      lowalt.velocity:
      - 0.0
      - 0.0
      - 0.0
      lowalt.motion_energy_j: 240000.0
      lowalt.capacity_j: 240000.0
      lowalt.soc: 1.0
      lowalt.payload_kg: 0.0
      lowalt.payload_capacity_kg: 3.0
      lowalt.vehicle_class: parcel
      lowalt.membership: []
      lowalt.conflicts: []
      lowalt.weather_held: false
      lowalt.charging: false
      lowalt.energy_used_j: 0.0
      lowalt.distance_m: 0.0
    label: Drone P{index}
    business: logistics
    vehicle_class: parcel
engines:
  motion:
    plugin: kinematic
    config:
      model: enu_point_mass
      type_id: lowalt:UAV
      position_field: lowalt.position
      velocity_field: lowalt.velocity
      energy_field: lowalt.motion_energy_j
      max_speed_m_s: 20.0
      max_accel_m_s2: 8.0
      energy:
        idle_w: 50.0
        per_m_j: 12.0
        capacity_j: 240000.0
      commands:
        move_to: lowalt.motion.move_to
        hold: lowalt.motion.hold
        stop: lowalt.motion.stop
      arrival_schema: lowalt.motion.arrived
      arrival_topic: lowalt.events
      arrival_payload:
        entity: $entity
        position: $position
      result_fields:
        entity: entity
        position: position
        reason: reason
      step_ns: 1000000000
      lifecycle: false
      frame:
        convention: enu
        unit: m
        transform_revision: lowalt.district/v1
  airspace:
    plugin: lowalt_airspace
    config:
      tick_ns: 1000000000
      motion:
        target: motion
        move_to: lowalt.motion.move_to
        hold: lowalt.motion.hold
        stop: lowalt.motion.stop
      algorithm_config:
        path_planning:
          grid_m: 20.0
        charging:
          threshold: 0.2
        conflict_resolution:
          minimum_altitude_m: 125.0
      separation_horizontal_m: 20.0
      separation_vertical_m: 8.0
      wind_limits:
        parcel: 12.0
      activation_events: []
  energy:
    plugin: lowalt_energy
    config:
      tick_ns: 1000000000
      motion:
        target: motion
        move_to: lowalt.motion.move_to
        hold: lowalt.motion.hold
        stop: lowalt.motion.stop
      algorithm_config:
        path_planning:
          grid_m: 20.0
        charging:
          threshold: 0.2
      idle_w: 50.0
      per_m_j: 12.0
      speed_w_per_mps: 2.0
      payload_w_per_kg: 8.0
      headwind_w_per_mps: 5.0
      low_threshold: 0.2
      charge_radius_m: 2.0
      charging_target_soc: 0.9
  tasks:
    plugin: lowalt_tasks
    config:
      tick_ns: 1000000000
      motion:
        target: motion
        move_to: lowalt.motion.move_to
        hold: lowalt.motion.hold
        stop: lowalt.motion.stop
      algorithm_config:
        path_planning:
          grid_m: 20.0
        charging:
