    schema: *id006
    metadata:
      role: observation
      unit: ns
      time_semantics: canonical computation; half-open validity
  - id: lowalt.zone_active
    type: lowalt:AirspaceZone
    schema: *id005
    metadata:
      role: observation
      unit: '1'
      time_semantics: canonical computation; half-open validity
  - id: lowalt.zone_dynamic
    type: lowalt:AirspaceZone
    schema: *id005
    metadata:
      role: observation
      unit: '1'
      time_semantics: canonical computation; half-open validity
  - id: lowalt.task_kind
    type: lowalt:Task
    schema:
      type: string
      enum:
      - parcel
      - medical
      - inspection
      - survey
      - spraying
      - passenger
      - patrol
      - incident_response
    metadata:
      role: observation
      unit: '1'
      time_semantics: canonical computation; half-open validity
  - id: lowalt.task_state
    type: lowalt:Task
    schema: *id003
    metadata:
      role: observation
      unit: '1'
      time_semantics: canonical computation; half-open validity
  - id: lowalt.task_origin
    type: lowalt:Task
    schema: *id003
    metadata:
      role: observation
      unit: '1'
      time_semantics: canonical computation; half-open validity
  - id: lowalt.task_destination
    type: lowalt:Task
    schema: *id003
    metadata:
      role: observation
      unit: '1'
      time_semantics: canonical computation; half-open validity
  - id: lowalt.task_vehicle
