format: aeroagentsim.scenario/v1
id: parcel-delivery
registry:
  snapshot: registry.snapshot.json
  types:
  - id: lowalt:UAV
    parents:
    - oo:UAV
    abstract: false
  - id: lowalt:Site
    parents:
    - oo:ModelObject
    abstract: false
  - id: lowalt:Customer
    parents:
    - lowalt:Site
    abstract: false
  - id: lowalt:Vertiport
    parents:
    - lowalt:Site
    - oo:Facility
    abstract: false
  - id: lowalt:Depot
    parents:
    - lowalt:Vertiport
    abstract: false
  - id: lowalt:ChargingPad
    parents:
    - lowalt:Site
    abstract: false
  - id: lowalt:AirspaceZone
    parents:
    - oo:ModelObject
    abstract: false
  - id: lowalt:Task
    parents:
    - oo:Task
    abstract: false
  - id: lowalt:Environment
    parents:
    - oo:ModelObject
    abstract: false
  fields:
  - id: lowalt.position
    type: lowalt:UAV
    schema: &id001
      type: vector
      length: 3
      items: &id002
        type: number
    metadata:
      role: observation
      unit: m
      time_semantics: canonical computation; half-open validity
      frame: enu
      transform_revision: huangpu-lite-city/v1
  - id: lowalt.velocity
    type: lowalt:UAV
    schema: *id001
    metadata:
      role: observation
      unit: m/s
      time_semantics: canonical computation; half-open validity
      frame: enu
      transform_revision: huangpu-lite-city/v1
  - id: lowalt.soc
    type: lowalt:UAV
    schema: *id002
    metadata:
      role: observation
      unit: '1'
      time_semantics: canonical computation; half-open validity
  - id: lowalt.capacity_j
    type: lowalt:UAV
    schema: *id002
    metadata:
      role: observation
      unit: J
      time_semantics: canonical computation; half-open validity
  - id: lowalt.motion_energy_j
    type: lowalt:UAV
    schema: *id002
    metadata:
      role: observation
      unit: J
      time_semantics: canonical computation; half-open validity
  - id: lowalt.payload_kg
    type: lowalt:UAV
    schema: *id002
    metadata:
      role: observation
      unit: kg
      time_semantics: canonical computation; half-open validity
  - id: lowalt.payload_capacity_kg
    type: lowalt:UAV
    schema: *id002
    metadata:
      role: observation
      unit: kg
      time_semantics: canonical computation; half-open validity
  - id: lowalt.energy_used_j
    type: lowalt:UAV
    schema: *id002
    metadata:
      role: observation
      unit: J
      time_semantics: canonical computation; half-open validity
  - id: lowalt.distance_m
    type: lowalt:UAV
    schema: *id002
    metadata:
      role: observation
      unit: m
      time_semantics: canonical computation; half-open validity
  - id: lowalt.vehicle_class
    type: lowalt:UAV
    schema: &id003
      type: string
    metadata:
      role: observation
      unit: '1'
      time_semantics: canonical computation; half-open validity
  - id: lowalt.membership
    type: lowalt:UAV
    schema: &id004
      type: array
      items: *id003
    metadata:
      role: observation
      unit: '1'
      time_semantics: canonical computation; half-open validity
  - id: lowalt.conflicts
    type: lowalt:UAV
    schema: *id004
    metadata:
      role: observation
      unit: '1'
      time_semantics: canonical computation; half-open validity
  - id: lowalt.weather_held
    type: lowalt:UAV
    schema: &id005
      type: boolean
    metadata:
      role: observation
      unit: '1'
      time_semantics: canonical computation; half-open validity
  - id: lowalt.charging
    type: lowalt:UAV
    schema: *id005
    metadata:
      role: observation
      unit: '1'
      time_semantics: canonical computation; half-open validity
  - id: lowalt.site_position
    type: lowalt:Site
    schema: *id001
    metadata:
      role: observation
      unit: m
      time_semantics: canonical computation; half-open validity
      frame: enu
      transform_revision: huangpu-lite-city/v1
  - id: lowalt.site_open
    type: lowalt:Site
    schema: *id005
    metadata:
      role: observation
      unit: '1'
      time_semantics: canonical computation; half-open validity
  - id: lowalt.site_capacity
    type: lowalt:Site
    schema: &id006
      type: integer
      minimum: 0
    metadata:
      role: observation
      unit: '1'
      time_semantics: canonical computation; half-open validity
  - id: lowalt.pad_power_w
    type: lowalt:ChargingPad
    schema: *id002
    metadata:
      role: observation
      unit: W
      time_semantics: canonical computation; half-open validity
  - id: lowalt.wind
    type: lowalt:Environment
    schema: *id001
    metadata:
      role: observation
      unit: m/s
      time_semantics: canonical computation; half-open validity
      frame: enu
      transform_revision: huangpu-lite-city/v1
  - id: lowalt.zone_kind
    type: lowalt:AirspaceZone
    schema:
      type: string
      enum:
      - no_fly
      - restricted
      - altitude_band
      - corridor
    metadata:
      role: observation
      unit: '1'
      time_semantics: canonical computation; half-open validity
  - id: lowalt.zone_lower
    type: lowalt:AirspaceZone
    schema: *id001
    metadata:
      role: observation
      unit: m
      time_semantics: canonical computation; half-open validity
      frame: enu
      transform_revision: huangpu-lite-city/v1
  - id: lowalt.zone_upper
    type: lowalt:AirspaceZone
    schema: *id001
    metadata:
      role: observation
      unit: m
      time_semantics: canonical computation; half-open validity
      frame: enu
      transform_revision: huangpu-lite-city/v1
