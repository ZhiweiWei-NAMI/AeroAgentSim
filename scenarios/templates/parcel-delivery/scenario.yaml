run:
  seed: 42
  until_ns: 300000000000
  advance_ns: 10000000000
  pacing: fast
presentation:
- typeId: lowalt:UAV
  positionField: lowalt.position
  frame: enu
  visual:
    kind: marker
    color: '#50c9ff'
    scale: 2.0
- typeId: lowalt:Site
  positionField: lowalt.site_position
  frame: enu
  visual:
    kind: marker
    color: '#ffc658'
    scale: 3.0
behaviours:
- format: aeroagentsim.behaviour-package/v1
  id: lowalt.rules
  revision: 5
  registry:
    snapshot: registry.snapshot.json
  evaluator:
    version: aerograph-predicate/1
    dialect: original
  budgets:
    max_transitions_per_instance_per_ns: 64
    max_instances: 4000
    max_timers_per_instance: 8
    max_creations_per_instance: 8
  predicates:
    battery_below_reserve:
      profile: committed_reactive/v1
      roles:
        uav: lowalt:UAV
      parameters:
        reserve_percent: 20.0
      expression:
        op: lt
        args:
        - op: mul
          args:
          - field: lowalt.soc
            role: uav
            path: []
          - literal: 100.0
        - parameter: reserve_percent
    inside_no_fly_zone:
      profile: committed_reactive/v1
      roles:
        uav: lowalt:UAV
        zone: lowalt:AirspaceZone
      expression:
        op: contains
        args:
        - field: lowalt.breached_zones
          role: uav
          path: []
        - field: lowalt.zone_id
          role: zone
          path: []
    closer_than_safety_distance:
      profile: committed_reactive/v1
      roles:
        uav: lowalt:UAV
      parameters:
        horizontal_m: 20.0
      expression:
        op: and
        args:
        - op: ne
          args:
          - field: lowalt.conflict_partner
            role: uav
            path: []
          - literal: ''
        - op: lt
          args:
          - field: lowalt.conflict_gap_m
            role: uav
            path:
            - 0
          - parameter: horizontal_m
    wind_above_limit:
      profile: committed_reactive/v1
      roles:
        uav: lowalt:UAV
      parameters:
        parcel_limit_mps: 12.0
        medical_limit_mps: 12.0
        inspection_limit_mps: 6.0
        survey_limit_mps: 6.0
        spraying_limit_mps: 5.0
        passenger_limit_mps: 15.0
        patrol_limit_mps: 12.0
        incident_response_limit_mps: 14.0
      expression:
        op: or
        args:
        - op: and
          args:
          - op: eq
            args:
            - field: lowalt.vehicle_class
              role: uav
              path: []
            - literal: parcel
          - op: gt
            args:
            - field: lowalt.wind_mps
              role: uav
              path: []
            - parameter: parcel_limit_mps
        - op: and
          args:
          - op: eq
            args:
            - field: lowalt.vehicle_class
              role: uav
              path: []
            - literal: medical
          - op: gt
            args:
            - field: lowalt.wind_mps
              role: uav
              path: []
            - parameter: medical_limit_mps
        - op: and
          args:
          - op: eq
            args:
            - field: lowalt.vehicle_class
              role: uav
              path: []
            - literal: inspection
          - op: gt
            args:
            - field: lowalt.wind_mps
              role: uav
              path: []
            - parameter: inspection_limit_mps
        - op: and
          args:
          - op: eq
            args:
            - field: lowalt.vehicle_class
              role: uav
              path: []
            - literal: survey
          - op: gt
            args:
            - field: lowalt.wind_mps
              role: uav
              path: []
            - parameter: survey_limit_mps
        - op: and
          args:
          - op: eq
            args:
            - field: lowalt.vehicle_class
              role: uav
              path: []
            - literal: spraying
          - op: gt
            args:
            - field: lowalt.wind_mps
              role: uav
              path: []
            - parameter: spraying_limit_mps
        - op: and
          args:
          - op: eq
            args:
            - field: lowalt.vehicle_class
              role: uav
              path: []
            - literal: passenger
          - op: gt
            args:
            - field: lowalt.wind_mps
              role: uav
              path: []
            - parameter: passenger_limit_mps
        - op: and
          args:
          - op: eq
            args:
            - field: lowalt.vehicle_class
              role: uav
              path: []
            - literal: patrol
          - op: gt
            args:
            - field: lowalt.wind_mps
              role: uav
              path: []
            - parameter: patrol_limit_mps
        - op: and
          args:
          - op: eq
            args:
            - field: lowalt.vehicle_class
              role: uav
              path: []
            - literal: incident_response
          - op: gt
            args:
            - field: lowalt.wind_mps
              role: uav
              path: []
            - parameter: incident_response_limit_mps
  chains:
    battery_reserve:
      roles:
        uav: lowalt:UAV
      trigger:
        instance: activated
      preconditions: []
      states:
      - monitoring
      - returning
      - waiting
      initial: monitoring
      terminal: []
      transitions:
      - id: armed
        from: monitoring
        'on':
          instance: activated
        to: monitoring
        priority: 0
        actions: []
      - id: low
        from: monitoring
        'on':
          predicate: battery_below_reserve
          edge: while
        to: returning
        priority: 0
        actions:
        - id: recalling
          kind: set
          entity:
            $role: uav
          field: lowalt.returning_to_charge
          value: true
        - id: battery-low
          kind: emit
          schema: lowalt.energy.low
          topic: lowalt.events
          payload:
            vehicle:
              $id: uav
            soc:
              field: lowalt.soc
              role: uav
              path: []
        - id: recall
          kind: command
          capability: lowalt.energy.return_to_pad
          payload:
            vehicle:
              $id: uav
            reason: battery below reserve
      - id: charged
        from: returning
        'on':
          receipt: recall
          status: succeeded
        to: monitoring
        priority: 0
        actions:
        - id: ready
          kind: set
          entity:
            $role: uav
          field: lowalt.returning_to_charge
          value: false
      - id: recall-failed
        from: returning
        'on':
          receipt: recall
          status: &id097
          - failed
          - rejected
          - canceled
        to: waiting
        priority: 0
        actions:
        - id: recall-rejected
          kind: set
          entity:
            $role: uav
          field: lowalt.returning_to_charge
          value: false
      - id: recharged
        from: waiting
        'on':
          predicate: battery_below_reserve
          edge: exited
        to: monitoring
        priority: 0
        actions: []
    no_fly_zone:
      roles:
        uav: lowalt:UAV
        zone: lowalt:AirspaceZone
      trigger:
        instance: activated
      preconditions: []
      states:
      - monitoring
      - rerouting
      initial: monitoring
      terminal: []
      transitions:
      - id: armed
        from: monitoring
        'on':
          instance: activated
        to: monitoring
        priority: 0
        actions: []
      - id: entered-zone
        from: monitoring
        'on':
          predicate: inside_no_fly_zone
          edge: entered
        to: rerouting
        priority: 0
        actions:
        - id: geofence
          kind: emit
          schema: lowalt.airspace.geofence_entered
          topic: lowalt.events
          payload:
            vehicle:
              $id: uav
            zone:
              $id: zone
        - id: reroute
          kind: command
          capability: lowalt.airspace.flight_control
          payload:
            vehicle:
              $id: uav
            action: reroute
            reason: no-fly zone
      - id: left-zone
        from: rerouting
        'on':
          predicate: inside_no_fly_zone
          edge: exited
        to: monitoring
        priority: 0
        actions: []
    separation:
      roles:
        uav: lowalt:UAV
      trigger:
        instance: activated
      preconditions: []
      states:
      - monitoring
      - resolving
      initial: monitoring
      terminal: []
      transitions:
      - id: armed
        from: monitoring
        'on':
          instance: activated
        to: monitoring
        priority: 0
        actions: []
      - id: too-close
        from: monitoring
        'on':
          predicate: closer_than_safety_distance
          edge: while
        to: resolving
        priority: 0
        actions:
        - id: conflict
          kind: emit
          schema: lowalt.airspace.conflict
          topic: lowalt.events
          payload:
            a:
              $id: uav
            b:
              field: lowalt.conflict_partner
              role: uav
              path: []
            horizontal_m:
              field: lowalt.conflict_gap_m
              role: uav
              path:
              - 0
            vertical_m:
              field: lowalt.conflict_gap_m
              role: uav
              path:
              - 1
        - id: resolve
          kind: command
          capability: lowalt.airspace.resolve_conflict
          payload:
            a:
              $id: uav
            b:
              field: lowalt.conflict_partner
              role: uav
              path: []
      - id: separated
        from: resolving
        'on':
          receipt: resolve
          status: succeeded
        to: monitoring
        priority: 0
        actions:
        - id: resolved
          kind: emit
          schema: lowalt.airspace.conflict_resolved
          topic: lowalt.events
          payload:
            a:
              $trigger: result.a
            b:
              $trigger: result.b
            action:
              $trigger: result.action
      - id: resolve-failed
        from: resolving
        'on':
          receipt: resolve
          status: *id097
        to: monitoring
        priority: 0
        actions: []
    wind_limit:
      roles:
        uav: lowalt:UAV
      trigger:
        instance: activated
      preconditions: []
      states:
      - flying
      - held
      initial: flying
      terminal: []
      transitions:
      - id: armed
        from: flying
        'on':
          instance: activated
        to: flying
        priority: 0
        actions: []
      - id: too-windy
        from: flying
        'on':
          predicate: wind_above_limit
          edge: while
        to: held
        priority: 0
        actions:
        - id: grounded
          kind: set
          entity:
            $role: uav
          field: lowalt.weather_held
          value: true
        - id: weather-hold
          kind: emit
          schema: lowalt.weather.hold
          topic: lowalt.events
          payload:
            vehicle:
              $id: uav
            reason: wind exceeds vehicle limit
            wind_mps:
              field: lowalt.wind_mps
              role: uav
              path: []
        - id: hold
          kind: command
          capability: lowalt.airspace.flight_control
          payload:
            vehicle:
              $id: uav
            action: hold
            reason: weather
      - id: calm
        from: held
        'on':
          predicate: wind_above_limit
          edge: exited
        to: flying
        priority: 0
        actions:
        - id: cleared
          kind: set
          entity:
            $role: uav
          field: lowalt.weather_held
          value: false
        - id: weather-release
          kind: emit
          schema: lowalt.weather.release
          topic: lowalt.events
          payload:
            vehicle:
              $id: uav
            reason: wind within vehicle limit
            wind_mps:
              field: lowalt.wind_mps
              role: uav
              path: []
        - id: release
          kind: command
          capability: lowalt.airspace.flight_control
          payload:
            vehicle:
              $id: uav
            action: release
            reason: weather
  bindings:
  - id: battery-reserve
    chain: battery_reserve
    match:
      uav:
        is_a: lowalt:UAV
    variables: {}
    multiplicity: once_per_entity
    on_unbind: retain_until_terminal
  - id: no-fly-zone
    chain: no_fly_zone
    match:
      uav:
        is_a: lowalt:UAV
      zone:
        is_a: lowalt:AirspaceZone
        field: lowalt.zone_kind
        in:
        - no_fly
        - restricted
    variables: {}
    multiplicity: once_per_entity
    on_unbind: retain_until_terminal
  - id: separation
    chain: separation
    match:
      uav:
        is_a: lowalt:UAV
    variables: {}
    multiplicity: once_per_entity
    on_unbind: retain_until_terminal
  - id: wind-limit
    chain: wind_limit
    match:
      uav:
        is_a: lowalt:UAV
    variables: {}
    multiplicity: once_per_entity
    on_unbind: retain_until_terminal
- format: aeroagentsim.behaviour-package/v1
  id: lowalt.operator
  revision: 1
  registry:
    snapshot: registry.snapshot.json
  evaluator:
    version: aerograph-predicate/1
    dialect: original
  budgets:
    max_transitions_per_instance_per_ns: 64
    max_instances: 100
    max_timers_per_instance: 8
    max_creations_per_instance: 8
  predicates: {}
  chains: {}
  bindings: []
  injection_points:
  - id: change-dropoff
    stream_id: operator
    command: aas.runtime.inject_event
    target: behaviour
    emits: lowalt.operator.change_dropoff
    topic: lowalt.events
ingress_streams:
- id: operator
  engine_ids:
  - behaviour
  mapping_id: canonical
  initial_watermark_ns: 300000000000
  lateness: reject
  timeout_s: 10.0
event_narratives:
  lowalt.parcel.dropoff_changed:
    entities:
    - task
    - previous
    - destination
    position: destination
    category: logistics
    severity: notice
    template: '{task} drop-off changed from {previous} to {destination}'
    template_zh: '{task}收货点从{previous}改为{destination}'
  lowalt.medical.prioritized:
    entities:
    - task
    category: emergency
    severity: notice
    template: Urgent request raised {task} priority to {priority}
    template_zh: 紧急请求将{task}优先级提高至 {priority}
  lowalt.inspection.defect_reported:
    entities:
    - site
    - task
    position: site
    category: inspection
    severity: warning
    template: Defect reported at {site}; {task} released for inspection
    template_zh: '{site}收到缺陷报告，已释放{task}进行复查'
  lowalt.spraying.paused:
    entities:
    - task
    category: agriculture
    severity: notice
    template: Operator paused spraying for {task}
    template_zh: 操作员已暂停{task}的喷洒作业
  lowalt.spraying.resumed:
    entities:
    - task
    category: agriculture
    severity: info
    template: '{task} resumed after the operator spraying pause'
    template_zh: 操作员停喷时段结束，{task}恢复喷洒作业
