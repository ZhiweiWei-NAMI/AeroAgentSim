  - id: lowalt.motion.move_to
    kind: command
    schema:
      type: record
      members:
        entity: *id003
        target: *id001
      required:
      - entity
      - target
      extra: false
    result_schema: &id007
      type: record
      members:
        entity: *id003
        position: *id001
        reason: *id003
      required: []
      extra: false
    feedback_schema: *id007
    cancel_support: false
  - id: lowalt.motion.hold
    kind: command
    schema:
      type: record
      members:
        entity: *id003
      required:
