        capacity_j: 100000.0
        idle_w: 40.0
        per_m_j: 6.0
      reserve_j: 10000.0
      consumption_model:
        plugin: wind
        config:
          entity: weather
          field: lowalt.wind
          coefficient_w_per_m_s2: 0.5
