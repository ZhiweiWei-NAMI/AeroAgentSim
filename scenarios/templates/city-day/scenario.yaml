        aas:TrafficUAV: he.aircraft.position_enu_m
        lowalt:UAV: lowalt.position
outputs:
  durability: flush
run:
  seed: 42
  until_ns: 300000000000
  advance_ns: 10000000000
  pacing: fast
presentation:
- typeId: lowalt:UAV
  positionField: lowalt.position
  frame: enu
  visual:
    kind: marker
    color: '#50c9ff'
    scale: 2.0
- typeId: lowalt:Site
  positionField: lowalt.site_position
  frame: enu
  visual:
    kind: marker
    color: '#ffc658'
    scale: 3.0
- typeId: aas:TrafficRoadVehicle
  positionField: traffic.road.position_enu_m
  orientationField: traffic.road.attitude_xyzw
  frame: enu
  visual:
    kind: marker
    color: '#e8a444'
    scale: 1.5
- typeId: aas:TrafficUAV
  positionField: he.aircraft.position_enu_m
  frame: enu
  visual:
    kind: marker
    color: '#50c9ff'
    scale: 1.5
- typeId: lowalt:Field
  positionField: lowalt.site_position
  frame: enu
  visual:
    kind: model
    asset: data:model/gltf+json;base64,
    scale: 1.0
    color: '#2e7b2e'
ingress_streams:
- id: operator
  engine_ids:
  - behaviour
  mapping_id: canonical
  initial_watermark_ns: 300000000000
  lateness: reject
  timeout_s: 10.0
behaviours:
- format: aeroagentsim.behaviour-package/v1
  id: lowalt.rules
  revision: 1
  registry:
    snapshot: registry.snapshot.json
  evaluator:
    version: aerograph-predicate/1
    dialect: original
  budgets:
    max_transitions_per_instance_per_ns: 64
    max_instances: 4000
    max_timers_per_instance: 8
    max_creations_per_instance: 8
  predicates:
    battery_below_reserve:
      profile: committed_reactive/v1
      roles:
        uav: lowalt:UAV
      parameters:
        reserve_percent: 20.0
      expression:
        op: lt
        args:
        - op: mul
          args:
          - field: lowalt.soc
            role: uav
            path: []
          - literal: 100.0
        - parameter: reserve_percent
    inside_no_fly_zone:
      profile: committed_reactive/v1
      roles:
        uav: lowalt:UAV
      expression:
        op: gt
        args:
        - op: len
          args:
          - field: lowalt.breached_zones
            role: uav
            path: []
        - literal: 0
    closer_than_safety_distance:
      profile: committed_reactive/v1
      roles:
        uav: lowalt:UAV
      expression:
        op: ne
        args:
        - field: lowalt.conflict_partner
          role: uav
          path: []
        - literal: ''
    wind_above_limit:
      profile: committed_reactive/v1
      roles:
        uav: lowalt:UAV
      expression:
        op: gt
        args:
        - field: lowalt.wind_mps
          role: uav
          path: []
        - field: lowalt.wind_limit_mps
          role: uav
          path: []
  chains:
    battery_reserve:
      roles:
        uav: lowalt:UAV
      trigger:
        instance: activated
      preconditions: []
      states:
      - monitoring
      - returning
      - waiting
      initial: monitoring
      terminal: []
      transitions:
      - id: armed
        from: monitoring
        'on':
          instance: activated
        to: monitoring
        priority: 0
        actions: []
      - id: low
        from: monitoring
        'on':
          predicate: battery_below_reserve
          edge: while
        to: returning
        priority: 0
        actions:
        - id: battery-low
          kind: emit
          schema: lowalt.energy.low
          topic: lowalt.events
          payload:
            vehicle:
              $id: uav
            soc:
              field: lowalt.soc
              role: uav
              path: []
        - id: recall
          kind: command
          capability: lowalt.energy.return_to_pad
          payload:
            vehicle:
              $id: uav
            reason: battery below reserve
      - id: charged
        from: returning
        'on':
          receipt: recall
          status: succeeded
        to: monitoring
        priority: 0
        actions: []
      - id: recall-failed
        from: returning
        'on':
          receipt: recall
          status: &id240
          - failed
          - rejected
          - canceled
        to: waiting
        priority: 0
        actions: []
      - id: recharged
        from: waiting
        'on':
          predicate: battery_below_reserve
          edge: exited
        to: monitoring
        priority: 0
        actions: []
    no_fly_zone:
      roles:
        uav: lowalt:UAV
      trigger:
        instance: activated
      preconditions: []
      states:
      - monitoring
      - rerouting
      initial: monitoring
      terminal: []
      transitions:
      - id: armed
        from: monitoring
        'on':
          instance: activated
        to: monitoring
        priority: 0
        actions: []
      - id: entered-zone
        from: monitoring
        'on':
          predicate: inside_no_fly_zone
          edge: entered
        to: rerouting
        priority: 0
        actions:
        - id: geofence
          kind: emit
          schema: lowalt.airspace.geofence_entered
          topic: lowalt.events
          payload:
            vehicle:
              $id: uav
            zone:
              field: lowalt.breached_zones
              role: uav
              path:
              - 0
        - id: reroute
          kind: command
          capability: lowalt.airspace.flight_control
          payload:
            vehicle:
              $id: uav
            action: reroute
            reason: no-fly zone
      - id: left-zone
        from: rerouting
        'on':
          predicate: inside_no_fly_zone
          edge: exited
        to: monitoring
        priority: 0
        actions: []
    separation:
      roles:
        uav: lowalt:UAV
      trigger:
        instance: activated
      preconditions: []
      states:
      - monitoring
      - resolving
      initial: monitoring
      terminal: []
      transitions:
      - id: armed
        from: monitoring
        'on':
          instance: activated
        to: monitoring
        priority: 0
        actions: []
      - id: too-close
        from: monitoring
        'on':
          predicate: closer_than_safety_distance
          edge: while
        to: resolving
        priority: 0
        actions:
        - id: conflict
          kind: emit
          schema: lowalt.airspace.conflict
          topic: lowalt.events
          payload:
            a:
              $id: uav
            b:
              field: lowalt.conflict_partner
              role: uav
              path: []
            horizontal_m:
              field: lowalt.conflict_gap_m
              role: uav
              path:
              - 0
            vertical_m:
              field: lowalt.conflict_gap_m
              role: uav
              path:
              - 1
        - id: resolve
          kind: command
          capability: lowalt.airspace.resolve_conflict
          payload:
            a:
              $id: uav
            b:
              field: lowalt.conflict_partner
              role: uav
              path: []
      - id: separated
        from: resolving
        'on':
          receipt: resolve
          status: succeeded
        to: monitoring
        priority: 0
        actions:
        - id: resolved
          kind: emit
          schema: lowalt.airspace.conflict_resolved
          topic: lowalt.events
          payload:
            a:
              $trigger: result.a
            b:
              $trigger: result.b
            action:
              $trigger: result.action
      - id: resolve-failed
        from: resolving
        'on':
          receipt: resolve
          status: *id240
        to: monitoring
        priority: 0
        actions: []
    wind_limit:
      roles:
        uav: lowalt:UAV
      trigger:
        instance: activated
      preconditions: []
      states:
      - flying
      - held
      initial: flying
      terminal: []
      transitions:
      - id: armed
        from: flying
        'on':
          instance: activated
        to: flying
        priority: 0
        actions: []
      - id: too-windy
        from: flying
        'on':
          predicate: wind_above_limit
          edge: entered
        to: held
        priority: 0
        actions:
        - id: grounded
          kind: set
          entity:
            $role: uav
          field: lowalt.weather_held
          value: true
        - id: weather-hold
          kind: emit
          schema: lowalt.weather.hold
          topic: lowalt.events
          payload:
            vehicle:
              $id: uav
            reason: wind exceeds vehicle limit
            wind_mps:
              field: lowalt.wind_mps
              role: uav
              path: []
        - id: hold
          kind: command
          capability: lowalt.airspace.flight_control
          payload:
            vehicle:
              $id: uav
            action: hold
            reason: weather
      - id: calm
        from: held
        'on':
          predicate: wind_above_limit
          edge: exited
        to: flying
        priority: 0
        actions:
        - id: cleared
          kind: set
          entity:
            $role: uav
          field: lowalt.weather_held
          value: false
        - id: weather-release
          kind: emit
          schema: lowalt.weather.release
          topic: lowalt.events
          payload:
            vehicle:
              $id: uav
            reason: wind within vehicle limit
            wind_mps:
              field: lowalt.wind_mps
              role: uav
              path: []
        - id: release
          kind: command
          capability: lowalt.airspace.flight_control
          payload:
            vehicle:
              $id: uav
            action: release
            reason: weather
  bindings:
