format: aeroagentsim.template/v1
city: huangpu
id: air-taxi
title: Air taxi service
title_zh: 空中出租车服务
summary: Small passenger aircraft travel between three vertiports and share limited
  landing pads.
summary_zh: 小型载客飞行器往返于三座垂直起降场，共享数量有限的起降位。
category: mobility
difficulty: beginner
duration_s: 300
scenario: scenario.yaml
observe:
- Close aircraft move to separate altitude layers.
- Flights wait when a landing pad is occupied.
observe_zh:
- 相距过近的飞行器调整到不同高度层。
- 起降位被占用时，航班等待空位。
try:
- Choose interactive mode. Select east-port and inject close-vertiport. Flights using
  it divert to north-port, with real route braking and replanning. Follow closure,
  dispatch and flight completion in Why?.
- Change the number of aircraft.
- Compare altitude layers with hold-and-go.
try_zh:
- 选择实时交互模式。选择 east-port 并注入 close-vertiport。使用该起降场的航班改往 north-port，实际制动并重新规划航线；在“为什么？”中查看关闭、调度和航班完成。
- 调整飞行器数量。
- 对比高度分层与等待放行策略。
knobs:
- id: run_mode
  label: Run mode
  label_zh: 运行方式
  type: choice
  default: scheduled
  options:
  - scheduled
  - interactive
  options_zh:
  - 自动运行（无需人工推进）
  - 实时交互（控制台推进与注入）
  description: Scheduled runs keep their authored arrivals. Interactive mode waits
    for console time advances and operator events; Stop ends the run.
  description_zh: 自动运行保留原有任务到达计划。实时交互等待控制台推进时间及操作员事件；可随时停止。
  apply: lowalt.operator_mode
- id: fleet_size
  label: Number of aircraft
  label_zh: 飞行器数量
  type: integer
  default: 3
  min: 1
  max: 12
  pointer: /generators/fleet/count
- id: wind_speed
  label: Normal wind speed (m/s)
  label_zh: 常态风速（米/秒）
  type: number
  default: 2.0
  min: 0
  max: 15
  pointer: /engines/environment/config/profiles/weather/lowalt.wind/value/0
- id: conflict_resolver
  label: How aircraft separate
  label_zh: 飞行器间隔策略
  type: choice
  default: altitude_layers
  options:
  - altitude_layers
  - hold_and_go
  pointer: /algorithms/conflict_resolution
- id: battery_reserve
  label: Battery reserve (%)
  label_zh: 预留电量（%）
  type: number
  default: 20
  min: 10
  max: 85
  pointer: /behaviours/0/predicates/battery_below_reserve/parameters/reserve_percent
- id: safety_distance
  label: Safety distance (m)
  label_zh: 安全间隔（米）
  type: number
  default: 20
  min: 5
  max: 60
  pointer: /behaviours/0/predicates/closer_than_safety_distance/parameters/horizontal_m
- id: wind_limit
  label: Wind limit (m/s)
  label_zh: 风速上限（米/秒）
  type: number
  default: 15
  min: 2
  max: 20
  pointer: /behaviours/0/predicates/wind_above_limit/parameters/passenger_limit_mps
kpis:
- tasks_completed
- mean_task_latency_s
- energy_used_kj
- weather_holds
- separation_conflicts
thumbnail: thumbnail.png
