format: aeroagentsim.template/v1
city: huangpu
id: air-taxi
title: Air taxi service
summary: Small passenger aircraft travel between three vertiports and share limited
  landing pads.
category: mobility
difficulty: beginner
duration_s: 300
scenario: scenario.yaml
observe:
- Close aircraft move to separate altitude layers.
- Flights wait when a landing pad is occupied.
try:
- Change the number of aircraft.
- Compare altitude layers with hold-and-go.
knobs:
- id: fleet_size
  label: Number of aircraft
  type: integer
  default: 3
  min: 1
  max: 12
  pointer: /generators/fleet/count
- id: wind_speed
  label: Normal wind speed (m/s)
  type: number
  default: 2.0
  min: 0
  max: 15
  pointer: /engines/environment/config/profiles/weather/lowalt.wind/value/0
- id: conflict_resolver
  label: How aircraft separate
  type: choice
  default: altitude_layers
  options:
  - altitude_layers
  - hold_and_go
  pointer: /algorithms/conflict_resolution
- id: battery_reserve
  label: Battery reserve (%)
  type: number
  default: 20
  min: 10
  max: 85
  pointer: /behaviours/0/predicates/battery_below_reserve/parameters/reserve_percent
- id: safety_distance
  label: Safety distance (m)
  type: number
  default: 20
  min: 5
  max: 60
  pointer: /behaviours/0/predicates/closer_than_safety_distance/parameters/horizontal_m
- id: wind_limit
  label: Wind limit (m/s)
  type: number
  default: 15
  min: 2
  max: 20
  pointer: /behaviours/0/predicates/wind_above_limit/parameters/passenger_limit_mps
kpis:
- tasks_completed
- mean_task_latency_s
- energy_used_kj
- weather_holds
- separation_conflicts
thumbnail: thumbnail.png
