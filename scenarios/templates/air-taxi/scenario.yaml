        task: *id003
        vehicle: *id003
      required:
      - task
      - vehicle
      extra: false
  - id: lowalt.task.replanned
    kind: event
    schema:
      type: record
      members:
        task: *id003
        vehicle: *id003
        reason: *id003
        zone: *id003
      required:
      - task
      - vehicle
      - reason
      extra: false
  - id: lowalt.inspection.observed
    kind: event
    schema:
      type: record
      members:
        task: *id003
        vehicle: *id003
        position: *id001
        distance_m: *id002
      required:
      - task
      - vehicle
      - position
      - distance_m
      extra: false
  - id: lowalt.spraying.applied
    kind: event
    schema:
      type: record
      members:
        task: *id003
        vehicle: *id003
        position: *id001
        distance_m: *id002
      required:
      - task
      - vehicle
      - position
      - distance_m
      extra: false
  - id: lowalt.patrol.visited
    kind: event
    schema:
      type: record
      members:
        task: *id003
        vehicle: *id003
        position: *id001
      required:
      - task
      - vehicle
      - position
      extra: false
  - id: lowalt.site.closed
    kind: event
    schema:
      type: record
      members:
        site: *id003
      required:
      - site
      extra: false
  - id: lowalt.operator.close_vertiport
    kind: event
    schema:
      type: record
      members:
        site: *id003
      required:
      - site
      extra: false
  - id: lowalt.operator.add_urgent_order
    kind: event
    schema:
      type: record
      members:
        task: *id003
        origin: *id003
        destination: *id003
      required:
      - task
      - origin
      - destination
      extra: false
  - id: lowalt.operator.investigate
    kind: event
    schema:
      type: record
      members:
        task: *id003
        origin: *id003
        destination: *id003
      required:
      - task
      - origin
      - destination
      extra: false
  - id: lowalt.energy.swap_started
    kind: event
