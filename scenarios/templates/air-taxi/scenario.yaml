    metadata:
      role: observation
      unit: '1'
      time_semantics: canonical computation; half-open validity
  - id: lowalt.task_created_ns
    type: lowalt:Task
    schema: *id006
    metadata:
      role: observation
      unit: ns
      time_semantics: canonical computation; half-open validity
  messages:
  - id: lowalt.task.created
    kind: event
    schema:
      type: record
      members:
        task: *id003
        kind: *id003
        priority: *id006
        origin: *id003
        destination: *id003
      required:
      - task
      - kind
      - priority
      extra: false
  - id: lowalt.task.assigned
    kind: event
    schema:
      type: record
      members:
        task: *id003
        vehicle: *id003
        algorithm: *id003
      required:
      - task
      - vehicle
      - algorithm
      extra: false
  - id: lowalt.task.started
    kind: event
    schema:
      type: record
      members:
        task: *id003
        vehicle: *id003
      required:
      - task
      - vehicle
      extra: false
  - id: lowalt.task.picked_up
