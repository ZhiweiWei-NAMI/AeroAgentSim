      type: record
      members:
        vehicle: *id003
        pad: *id003
      required:
      - vehicle
      - pad
      extra: false
  - id: lowalt.energy.swap_finished
    kind: event
    schema:
      type: record
      members:
        vehicle: *id003
        pad: *id003
        soc: *id002
      required:
      - vehicle
      - pad
      - soc
      extra: false
  - id: lowalt.mobility.pad_wait
    kind: event
