bindings:
  rules:
  - writer: motion
    type: lowalt:UAV
    fields:
    - lowalt.position
    - lowalt.velocity
  - writer: energy
    type: lowalt:UAV
    fields:
    - lowalt.soc
    - lowalt.charging
    - lowalt.energy_used_j
    - lowalt.distance_m
    - lowalt.motion_energy_j
  - writer: airspace
    type: lowalt:UAV
    fields:
    - lowalt.membership
    - lowalt.conflicts
    - lowalt.wind_mps
    - lowalt.breached_zones
    - lowalt.conflict_partner
    - lowalt.conflict_gap_m
  - writer: tasks
    type: lowalt:UAV
    fields:
    - lowalt.capacity_j
    - lowalt.payload_kg
    - lowalt.payload_capacity_kg
    - lowalt.vehicle_class
  - writer: tasks
    type: lowalt:Site
    fields:
    - lowalt.site_position
    - lowalt.site_open
    - lowalt.site_capacity
  - writer: tasks
    type: lowalt:ChargingPad
    fields:
    - lowalt.pad_power_w
  - writer: tasks
    type: lowalt:Task
    fields:
    - lowalt.task_state
    - lowalt.task_kind
    - lowalt.task_priority
    - lowalt.task_origin
    - lowalt.task_destination
    - lowalt.task_created_ns
    - lowalt.task_vehicle
    - lowalt.task_payload_kg
  - writer: tasks
    type: lowalt:AirspaceZone
    fields:
    - lowalt.zone_kind
    - lowalt.zone_lower
    - lowalt.zone_upper
    - lowalt.zone_start_ns
    - lowalt.zone_end_ns
    - lowalt.zone_dynamic
  - writer: airspace
    type: lowalt:AirspaceZone
    fields:
    - lowalt.zone_active
  - writer: environment
    type: lowalt:Environment
    fields:
    - lowalt.wind
  - writer: behaviour
    type: lowalt:UAV
    fields:
    - lowalt.weather_held
    - lowalt.wind_limit_mps
  lifecycle:
  - controller: tasks
    type: lowalt:UAV
  - controller: tasks
    type: lowalt:Site
  - controller: tasks
    type: lowalt:AirspaceZone
  - controller: tasks
    type: lowalt:Task
  - controller: environment
    type: lowalt:Environment
  commands: []
algorithms:
  allocation: nearest
  path_planning: corridor_astar
  conflict_resolution: altitude_layers
  charging: threshold_return
generators:
  fleet:
    count: 3
    prefix: drone-
    type: lowalt:UAV
    starts:
    - *id010
    spacing_m: 1.0
    facts:
      lowalt.velocity:
      - 0.0
      - 0.0
      - 0.0
      lowalt.motion_energy_j: 240000.0
      lowalt.capacity_j: 240000.0
      lowalt.soc: 1.0
      lowalt.payload_kg: 0.0
      lowalt.payload_capacity_kg: 150.0
      lowalt.vehicle_class: passenger
      lowalt.membership: []
      lowalt.conflicts: []
      lowalt.weather_held: false
      lowalt.charging: false
      lowalt.energy_used_j: 0.0
      lowalt.distance_m: 0.0
      lowalt.wind_limit_mps: 12.0
    label: Air taxi {index}
    business: mobility
    vehicle_class: passenger
engines:
  motion:
    plugin: kinematic
    config:
      model: enu_point_mass
      type_id: lowalt:UAV
      position_field: lowalt.position
      velocity_field: lowalt.velocity
      energy_field: lowalt.motion_energy_j
      max_speed_m_s: 20.0
      max_accel_m_s2: 8.0
      energy:
        idle_w: 50.0
        per_m_j: 12.0
        capacity_j: 240000.0
      commands:
        move_to: lowalt.motion.move_to
        hold: lowalt.motion.hold
        stop: lowalt.motion.stop
      arrival_schema: lowalt.motion.arrived
      arrival_topic: lowalt.events
      arrival_payload:
        entity: $entity
        position: $position
      result_fields:
        entity: entity
        position: position
        reason: reason
      step_ns: 1000000000
      lifecycle: false
      frame:
        convention: enu
        unit: m
        transform_revision: lowalt.district/v1
  airspace:
    plugin: lowalt_airspace
    config:
      tick_ns: 1000000000
      motion:
        target: motion
        move_to: lowalt.motion.move_to
        hold: lowalt.motion.hold
        stop: lowalt.motion.stop
      algorithm_config:
        path_planning:
          grid_m: 20.0
        charging:
          threshold: 1.0
        conflict_resolution:
          minimum_altitude_m: 125.0
      separation_horizontal_m: 20.0
      separation_vertical_m: 8.0
      activation_events: []
  energy:
    plugin: lowalt_energy
    config:
      tick_ns: 1000000000
      motion:
        target: motion
        move_to: lowalt.motion.move_to
        hold: lowalt.motion.hold
        stop: lowalt.motion.stop
      algorithm_config:
        path_planning:
          grid_m: 20.0
        charging:
          threshold: 1.0
      idle_w: 50.0
      per_m_j: 12.0
      speed_w_per_mps: 2.0
      payload_w_per_kg: 8.0
      headwind_w_per_mps: 5.0
      charge_radius_m: 2.0
      charging_target_soc: 0.9
  tasks:
    plugin: lowalt_tasks
    config:
      tick_ns: 1000000000
      motion:
        target: motion
        move_to: lowalt.motion.move_to
        hold: lowalt.motion.hold
        stop: lowalt.motion.stop
      algorithm_config:
        path_planning:
          grid_m: 20.0
        charging:
          threshold: 1.0
      arrival_radius_m: 0.5
      dispatch_min_soc: 0.05
      charging_resume_soc: 0.9
      generators:
      - kind: passenger
        tasks:
        - flight-1
        - flight-2
        - flight-3
        - flight-4
        - flight-5
        - flight-6
        - flight-7
        - flight-8
        origins:
        - home
        - east-port
        - north-port
        destinations:
        - home
        - east-port
        - north-port
        priority: 1
        payload_kg: 80.0
        arrivals:
          mode: scheduled
          times_ns:
          - 0
          - 0
          - 0
          - 80000000000
          - 80000000000
          - 150000000000
          - 150000000000
          - 220000000000
      work_routes:
        passenger:
          algorithm: survey
          config:
            waypoints:
            - - 103.312
              - -146.423
              - 125.0
            - - 72.424
              - 7.033
              - 125.0
            - - 54.895
              - 88.494
              - 125.0
            - - 54.39
              - 163.49
              - 125.0
            cruise_altitude_m: 125.0
      vehicle_kinds:
        passenger:
        - parcel
        - medical
        - inspection
        - spraying
        - passenger
        - patrol
        - incident_response
      pad_dwell_ns: 10000000000
      cruise_altitudes:
        passenger: 125.0
  environment:
    plugin: environment
    config:
      produces:
      - lowalt.wind
      lifecycle: true
      profiles:
        weather:
          lowalt.wind:
            mode: constant
            value:
            - 2.0
            - 0.0
            - 0.0
  behaviour:
    plugin: behaviour
    config:
      produces: []
      capabilities:
        lowalt.energy.return_to_pad:
          schema: lowalt.energy.return_to_pad
          target: energy
        lowalt.airspace.resolve_conflict:
          schema: lowalt.airspace.resolve_conflict
          target: airspace
        lowalt.airspace.flight_control:
          schema: lowalt.airspace.flight_control
          target: airspace
outputs:
  durability: flush
run:
  seed: 42
  until_ns: 300000000000
  advance_ns: 10000000000
  pacing: fast
presentation:
- typeId: lowalt:UAV
  positionField: lowalt.position
  frame: enu
  visual:
    kind: marker
    color: '#50c9ff'
    scale: 2.0
- typeId: lowalt:Site
  positionField: lowalt.site_position
  frame: enu
  visual:
    kind: marker
    color: '#ffc658'
    scale: 3.0
behaviours:
- format: aeroagentsim.behaviour-package/v1
  id: lowalt.rules
  revision: 1
  registry:
    snapshot: registry.snapshot.json
  evaluator:
    version: aerograph-predicate/1
    dialect: original
  budgets:
    max_transitions_per_instance_per_ns: 64
    max_instances: 4000
    max_timers_per_instance: 8
    max_creations_per_instance: 8
  predicates:
    battery_below_reserve:
      profile: committed_reactive/v1
      roles:
        uav: lowalt:UAV
      parameters:
        reserve_percent: 20.0
      expression:
        op: lt
        args:
        - op: mul
          args:
          - field: lowalt.soc
            role: uav
            path: []
          - literal: 100.0
        - parameter: reserve_percent
    inside_no_fly_zone:
      profile: committed_reactive/v1
      roles:
        uav: lowalt:UAV
      expression:
        op: gt
        args:
        - op: len
          args:
          - field: lowalt.breached_zones
            role: uav
            path: []
        - literal: 0
    closer_than_safety_distance:
      profile: committed_reactive/v1
      roles:
        uav: lowalt:UAV
      expression:
        op: ne
        args:
        - field: lowalt.conflict_partner
          role: uav
          path: []
        - literal: ''
    wind_above_limit:
      profile: committed_reactive/v1
      roles:
        uav: lowalt:UAV
      expression:
        op: gt
        args:
        - field: lowalt.wind_mps
          role: uav
          path: []
        - field: lowalt.wind_limit_mps
          role: uav
          path: []
  chains:
    battery_reserve:
      roles:
        uav: lowalt:UAV
      trigger:
        instance: activated
      preconditions: []
      states:
      - monitoring
      - returning
      - waiting
      initial: monitoring
      terminal: []
      transitions:
      - id: armed
        from: monitoring
        'on':
          instance: activated
        to: monitoring
        priority: 0
        actions: []
      - id: low
        from: monitoring
        'on':
          predicate: battery_below_reserve
          edge: while
        to: returning
        priority: 0
        actions:
        - id: battery-low
          kind: emit
          schema: lowalt.energy.low
          topic: lowalt.events
          payload:
            vehicle:
              $id: uav
            soc:
              field: lowalt.soc
              role: uav
              path: []
        - id: recall
          kind: command
          capability: lowalt.energy.return_to_pad
          payload:
            vehicle:
              $id: uav
            reason: battery below reserve
      - id: charged
        from: returning
        'on':
          receipt: recall
          status: succeeded
        to: monitoring
        priority: 0
        actions: []
      - id: recall-failed
        from: returning
        'on':
          receipt: recall
          status: &id013
          - failed
          - rejected
          - canceled
        to: waiting
        priority: 0
        actions: []
      - id: recharged
        from: waiting
        'on':
          predicate: battery_below_reserve
          edge: exited
        to: monitoring
        priority: 0
        actions: []
    no_fly_zone:
      roles:
        uav: lowalt:UAV
      trigger:
        instance: activated
      preconditions: []
      states:
      - monitoring
      - rerouting
      initial: monitoring
      terminal: []
      transitions:
      - id: armed
        from: monitoring
        'on':
          instance: activated
        to: monitoring
        priority: 0
        actions: []
      - id: entered-zone
        from: monitoring
        'on':
          predicate: inside_no_fly_zone
          edge: entered
        to: rerouting
        priority: 0
        actions:
        - id: geofence
          kind: emit
          schema: lowalt.airspace.geofence_entered
          topic: lowalt.events
          payload:
            vehicle:
              $id: uav
            zone:
              field: lowalt.breached_zones
              role: uav
              path:
              - 0
        - id: reroute
          kind: command
          capability: lowalt.airspace.flight_control
          payload:
            vehicle:
              $id: uav
            action: reroute
            reason: no-fly zone
      - id: left-zone
        from: rerouting
        'on':
          predicate: inside_no_fly_zone
          edge: exited
        to: monitoring
        priority: 0
        actions: []
    separation:
      roles:
        uav: lowalt:UAV
      trigger:
        instance: activated
      preconditions: []
      states:
      - monitoring
      - resolving
      initial: monitoring
      terminal: []
      transitions:
      - id: armed
        from: monitoring
        'on':
          instance: activated
        to: monitoring
        priority: 0
        actions: []
      - id: too-close
        from: monitoring
        'on':
          predicate: closer_than_safety_distance
          edge: while
        to: resolving
        priority: 0
        actions:
        - id: conflict
          kind: emit
          schema: lowalt.airspace.conflict
          topic: lowalt.events
          payload:
            a:
              $id: uav
            b:
              field: lowalt.conflict_partner
              role: uav
              path: []
            horizontal_m:
              field: lowalt.conflict_gap_m
              role: uav
              path:
              - 0
            vertical_m:
              field: lowalt.conflict_gap_m
              role: uav
              path:
              - 1
        - id: resolve
          kind: command
          capability: lowalt.airspace.resolve_conflict
          payload:
            a:
              $id: uav
            b:
              field: lowalt.conflict_partner
              role: uav
              path: []
      - id: separated
        from: resolving
        'on':
          receipt: resolve
          status: succeeded
        to: monitoring
        priority: 0
        actions:
        - id: resolved
          kind: emit
          schema: lowalt.airspace.conflict_resolved
          topic: lowalt.events
          payload:
            a:
              $trigger: result.a
            b:
              $trigger: result.b
            action:
              $trigger: result.action
      - id: resolve-failed
        from: resolving
        'on':
          receipt: resolve
          status: *id013
        to: monitoring
        priority: 0
        actions: []
    wind_limit:
      roles:
        uav: lowalt:UAV
      trigger:
        instance: activated
      preconditions: []
      states:
      - flying
      - held
      initial: flying
      terminal: []
      transitions:
      - id: armed
        from: flying
        'on':
          instance: activated
        to: flying
        priority: 0
        actions: []
      - id: too-windy
        from: flying
        'on':
          predicate: wind_above_limit
          edge: entered
        to: held
        priority: 0
        actions:
        - id: grounded
          kind: set
          entity:
            $role: uav
          field: lowalt.weather_held
          value: true
        - id: weather-hold
          kind: emit
          schema: lowalt.weather.hold
          topic: lowalt.events
          payload:
            vehicle:
              $id: uav
            reason: wind exceeds vehicle limit
            wind_mps:
              field: lowalt.wind_mps
              role: uav
              path: []
        - id: hold
          kind: command
          capability: lowalt.airspace.flight_control
          payload:
            vehicle:
              $id: uav
            action: hold
            reason: weather
      - id: calm
        from: held
        'on':
          predicate: wind_above_limit
          edge: exited
        to: flying
        priority: 0
        actions:
        - id: cleared
          kind: set
          entity:
            $role: uav
          field: lowalt.weather_held
          value: false
        - id: weather-release
          kind: emit
          schema: lowalt.weather.release
          topic: lowalt.events
          payload:
            vehicle:
              $id: uav
            reason: wind within vehicle limit
            wind_mps:
              field: lowalt.wind_mps
              role: uav
              path: []
        - id: release
          kind: command
          capability: lowalt.airspace.flight_control
          payload:
            vehicle:
              $id: uav
            action: release
            reason: weather
  bindings:
  - id: battery-reserve
    chain: battery_reserve
    match:
      uav:
        is_a: lowalt:UAV
    variables: {}
    multiplicity: once_per_entity
    on_unbind: retain_until_terminal
  - id: no-fly-zone
    chain: no_fly_zone
    match:
      uav:
        is_a: lowalt:UAV
    variables: {}
    multiplicity: once_per_entity
    on_unbind: retain_until_terminal
  - id: separation
    chain: separation
    match:
      uav:
        is_a: lowalt:UAV
    variables: {}
    multiplicity: once_per_entity
    on_unbind: retain_until_terminal
  - id: wind-limit
    chain: wind_limit
    match:
      uav:
        is_a: lowalt:UAV
    variables: {}
    multiplicity: once_per_entity
    on_unbind: retain_until_terminal
