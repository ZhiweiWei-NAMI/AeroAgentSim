bindings:
  rules:
  - writer: motion
    type: lowalt:UAV
    fields:
    - lowalt.position
    - lowalt.velocity
  - writer: energy
    type: lowalt:UAV
    fields:
    - lowalt.soc
    - lowalt.charging
    - lowalt.energy_used_j
    - lowalt.distance_m
    - lowalt.motion_energy_j
  - writer: airspace
    type: lowalt:UAV
    fields:
    - lowalt.membership
    - lowalt.conflicts
    - lowalt.weather_held
  - writer: tasks
    type: lowalt:UAV
    fields:
