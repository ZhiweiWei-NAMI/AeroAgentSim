      members:
        vehicle: *id003
        zone: *id003
        reason: *id003
        wind_mps: *id002
      required:
      - reason
      extra: false
  - id: lowalt.control
    kind: event
    schema:
      type: record
      members:
        vehicle: *id003
        action: *id003
        target: *id001
        until_ns: *id006
        reason: *id003
      required:
      - vehicle
      - action
      - reason
      extra: false
  - id: lowalt.allocation.request
    kind: event
    schema:
      type: record
      members:
        tasks_json: *id003
        vehicles_json: *id003
      required:
      - tasks_json
      - vehicles_json
      extra: false
  - id: lowalt.allocation.result
    kind: event
    schema:
      type: record
      members:
        assignments_json: *id003
      required:
      - assignments_json
      extra: false
  - id: lowalt.motion.arrived
    kind: event
    schema:
      type: record
      members:
        entity: *id003
        position: *id001
      required:
      - entity
      - position
      extra: false
  - id: lowalt.motion.move_to
    kind: command
    schema:
      type: record
      members:
        entity: *id003
        target: *id001
      required:
      - entity
      - target
      extra: false
    result_schema: &id007
      type: record
      members:
        entity: *id003
        position: *id001
        reason: *id003
      required: []
      extra: false
    feedback_schema: *id007
    cancel_support: false
  - id: lowalt.motion.hold
    kind: command
    schema:
      type: record
      members:
        entity: *id003
      required:
      - entity
      extra: false
    result_schema: *id007
    feedback_schema: *id007
    cancel_support: false
  - id: lowalt.motion.stop
    kind: command
    schema:
      type: record
      members:
        entity: *id003
      required:
      - entity
      extra: false
    result_schema: *id007
    feedback_schema: *id007
    cancel_support: false
  - id: lowalt.airspace.activate
    kind: command
    schema:
      type: record
      members:
        zone: *id003
        active: *id005
        reason: *id003
      required:
      - zone
      - active
      - reason
      extra: false
    result_schema:
      type: record
      members:
        zone: *id003
        active: *id005
      required:
      - zone
      - active
      extra: false
    cancel_support: false
