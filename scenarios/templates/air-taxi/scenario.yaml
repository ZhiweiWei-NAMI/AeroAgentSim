      - reason
      extra: false
  - id: lowalt.airspace.conflict
    kind: event
    schema:
      type: record
      members:
        a: *id003
        b: *id003
        horizontal_m: *id002
        vertical_m: *id002
      required:
      - a
      - b
      - horizontal_m
      - vertical_m
      extra: false
  - id: lowalt.airspace.conflict_resolved
    kind: event
    schema:
      type: record
      members:
        a: *id003
        b: *id003
        action: *id003
      required:
