format: aeroagentsim.template/v1
city: huangpu
id: crop-spraying
title: Crop spraying
title_zh: 农田喷洒作业
summary: A drone treats a field in rows, swaps batteries at the edge and pauses when
  wind is too strong.
summary_zh: 无人机逐行喷洒农田，在田边换电，风速过大时暂停作业。
category: agriculture
difficulty: beginner
duration_s: 400
scenario: scenario.yaml
observe:
- The drone follows alternating rows across the field.
- Battery swaps happen at the field edge.
- Spraying pauses during the wind front.
observe_zh:
- 无人机沿相邻作业行来回飞行，覆盖农田。
- 换电在农田边缘进行。
- 大风过境时喷洒暂停。
try:
- Choose interactive mode. Select field-1 and inject pause-spraying for 20 seconds.
  The motion owner stops the aircraft; spraying observations pause, then resume after
  the hold. Follow both records in Why?.
- Change row spacing to compare flight distance.
- Change the wind speed to test the spraying limit.
try_zh:
- 选择实时交互模式。选择 field-1，注入 pause-spraying，停喷时长设为 20 秒。运动组件使飞行器停止，喷洒观测在停喷时段暂停，随后恢复；在“为什么？”中追踪这两条记录。
- 调整作业行间距，对比飞行距离。
- 调整风速，测试喷洒作业的风速限制。
knobs:
- id: run_mode
  label: Run mode
  label_zh: 运行方式
  type: choice
  default: scheduled
  options:
  - scheduled
  - interactive
  options_zh:
  - 自动运行（无需人工推进）
  - 实时交互（控制台推进与注入）
  description: Scheduled runs keep their authored arrivals. Interactive mode waits
    for console time advances and operator events; Stop ends the run.
  description_zh: 自动运行保留原有任务到达计划。实时交互等待控制台推进时间及操作员事件；可随时停止。
  apply: lowalt.operator_mode
- id: fleet_size
  label: Number of aircraft
  label_zh: 飞行器数量
  type: integer
  default: 1
  min: 1
  max: 12
  pointer: /generators/fleet/count
- id: wind_speed
  label: Normal wind speed (m/s)
  label_zh: 常态风速（米/秒）
  type: number
  default: 2.0
  min: 0
  max: 15
  pointer: /engines/environment/config/profiles/weather/lowalt.wind/value/0
- id: row_spacing
  label: Spacing between spraying rows (m)
  label_zh: 喷洒作业行间距（米）
  type: number
  default: 30
  min: 10
  max: 80
  pointer: /engines/tasks/config/work_routes/spraying/config/spacing_m
- id: battery_reserve
  label: Battery reserve (%)
  label_zh: 预留电量（%）
  type: number
  default: 45
  min: 10
  max: 85
  pointer: /behaviours/0/predicates/battery_below_reserve/parameters/reserve_percent
- id: safety_distance
  label: Safety distance (m)
  label_zh: 安全间隔（米）
  type: number
  default: 20
  min: 5
  max: 60
  pointer: /behaviours/0/predicates/closer_than_safety_distance/parameters/horizontal_m
- id: wind_limit
  label: Wind limit (m/s)
  label_zh: 风速上限（米/秒）
  type: number
  default: 5
  min: 2
  max: 20
  pointer: /behaviours/0/predicates/wind_above_limit/parameters/spraying_limit_mps
kpis:
- tasks_completed
- mean_task_latency_s
- energy_used_kj
- weather_holds
- separation_conflicts
- spraying_distance_m
- battery_swaps
thumbnail: thumbnail.png
