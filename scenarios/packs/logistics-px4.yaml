entities:
- id: carrier-1
  type: aas:Carrier
  facts: {}
- id: depot
  type: aas:Facility
  facts:
    packs.facility.position:
    - 0.0
    - 0.0
    - 5.0
    packs.facility.pad_capacity: 1
    packs.facility.locker_capacity: 1
    packs.facility.dwell_ns: 1000000000
- id: locker
  type: aas:Facility
  facts:
    packs.facility.position:
    - 40.0
    - 0.0
    - 5.0
    packs.facility.pad_capacity: 1
    packs.facility.locker_capacity: 1
    # Measured native arrival is near 72s; a 55s stopped handoff targets tick 128.
    packs.facility.dwell_ns: 55000000000
- id: restriction-1
  type: agp:type:ActivityRestriction
  facts:
    packs.restriction.active: true
    packs.restriction.start_ns: 0
    packs.restriction.end_ns: 180000000000
    packs.restriction.lower:
    - 100.0
    - -10.0
    - 0.0
    packs.restriction.upper:
    - 120.0
    - 10.0
    - 30.0
    packs.restriction.activities:
    - parcel_transport
- id: order-1
  type: oo:Order
  facts:
    packs.order.state: unreleased
    packs.order.review: pending
- id: parcel-1
  type: aas:Parcel
  facts: {}
bindings:
  rules:
  - writer: logistics
    type: oo:Order
    fields:
    - packs.order.state
  - writer: logistics
    type: aas:Facility
    fields:
    - packs.facility.position
    - packs.facility.pad_capacity
    - packs.facility.locker_capacity
    - packs.facility.dwell_ns
  - writer: logistics
    type: agp:type:ActivityRestriction
    fields:
    - packs.restriction.active
    - packs.restriction.start_ns
    - packs.restriction.end_ns
    - packs.restriction.lower
    - packs.restriction.upper
    - packs.restriction.activities
  - writer: acceptance
    type: oo:Order
    fields:
    - packs.order.review
  - writer: flight
    type: aas:Carrier
    fields:
    - he.aircraft.position_enu_m
    - e1.px4.velocity
    - e1.px4.attitude
    - e1.px4.battery
    - e1.px4.armed
    - e1.px4.mode
    - e1.px4.landed
  - writer: launch
    type: aas:Carrier
    fields:
    - packs.flight.phase
  lifecycle:
  - controller: logistics
    type: oo:Order
  - controller: logistics
    type: aas:Parcel
  - controller: logistics
    type: aas:Facility
  - controller: logistics
    type: agp:type:ActivityRestriction
  - controller: flight
    type: aas:Carrier
  relations:
  - writer: logistics
    relation: packs.parcel.custodian
    type: aas:Parcel
  commands: []
engines:
  launch:
    plugin: workflow
    config:
      produces:
      - packs.flight.phase
      consumes:
      - packs.order.state
      emits:
      - adapters.px4_gazebo.arm
      - adapters.px4_gazebo.takeoff
      - adapters.px4_gazebo.land
      subscribes: []
      targets:
      - flight
      lifecycle: false
      machines:
      - entity: carrier-1
        field: packs.flight.phase
        initial: waiting
        states:
          waiting:
            transitions:
            - to: arming
              timer_ns: 1000000000
          arming:
            on_enter:
            - kind: command
              id: arm
              schema: adapters.px4_gazebo.arm
              target: flight
              payload:
                entity: carrier-1
            transitions:
            - to: taking_off
              receipt:
                status: succeeded
                children: [arm]
                policy: all
            - to: failed
              receipt: failed
            - to: failed
              receipt: rejected
          taking_off:
            on_enter:
            - kind: command
              id: takeoff
              schema: adapters.px4_gazebo.takeoff
              target: flight
              payload:
                entity: carrier-1
                altitude_m: 5.0
            transitions:
            - to: ready
              receipt:
                status: succeeded
                children: [takeoff]
                policy: all
            - to: failed
              receipt: failed
            - to: failed
              receipt: rejected
          ready:
            transitions:
            - to: landing
              predicate:
                entity: order-1
                field: packs.order.state
                op: eq
                value: accepted
          landing:
            on_enter:
            - kind: command
              id: land
              schema: adapters.px4_gazebo.land
              target: flight
              payload:
                entity: carrier-1
            transitions:
            - to: landed
              receipt:
                status: succeeded
                children: [land]
                policy: all
            - to: failed
              receipt: failed
            - to: failed
              receipt: rejected
          landed:
            transitions: []
          failed:
            transitions: []
  logistics:
    plugin: logistics
    config:
      fields:
        position: he.aircraft.position_enu_m
        velocity: e1.px4.velocity
        energy: e1.px4.battery
        state: packs.order.state
        facility_position: packs.facility.position
        pad_capacity: packs.facility.pad_capacity
        locker_capacity: packs.facility.locker_capacity
        dwell_ns: packs.facility.dwell_ns
        restriction_active: packs.restriction.active
