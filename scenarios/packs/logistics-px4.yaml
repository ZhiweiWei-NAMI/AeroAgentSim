format: aeroagentsim.scenario/v1
id: logistics-px4
registry:
  snapshot: aerograph.snapshot.json
  types:
  - id: aas:Custodian
    parents:
    - oo:ModelObject
    abstract: true
  - id: aas:Carrier
    parents:
    - oo:UAV
    - aas:Custodian
    abstract: false
  - id: aas:Facility
    parents:
    - oo:Facility
    - aas:Custodian
    abstract: false
  - id: aas:Parcel
    parents:
    - oo:ModelObject
    abstract: false
  - id: aas:Camera
    parents:
    - oo:ModelObject
    abstract: false
  - id: aas:InspectionObservation
    parents:
    - oo:ObservationRecord
    abstract: false
  fields:
  - id: packs.velocity
    type: oo:UAV
    schema: &id002
      type: vector
      length: 3
      items: &id001
        type: number
    metadata:
      role: observation
      unit: m/s
      time_semantics: explicit canonical model computation and half-open validity
      frame: enu
      transform_revision: packs.local/v1
  - id: packs.energy
    type: oo:UAV
    schema: *id001
    metadata:
      role: observation
      unit: J
      time_semantics: explicit canonical model computation and half-open validity
  - id: packs.facility.position
    type: aas:Facility
    schema: *id002
    metadata:
      role: observation
      unit: m
      time_semantics: explicit canonical model computation and half-open validity
      frame: enu
      transform_revision: packs.local/v1
  - id: packs.facility.pad_capacity
    type: aas:Facility
    schema: &id003
      type: integer
      minimum: 0
    metadata:
      role: observation
      unit: '1'
      time_semantics: explicit canonical model computation and half-open validity
  - id: packs.facility.locker_capacity
    type: aas:Facility
    schema: *id003
    metadata:
      role: observation
      unit: '1'
      time_semantics: explicit canonical model computation and half-open validity
  - id: packs.facility.dwell_ns
    type: aas:Facility
    schema: *id003
    metadata:
      role: observation
      unit: ns
      time_semantics: explicit canonical model computation and half-open validity
  - id: packs.restriction.active
    type: agp:type:ActivityRestriction
    schema:
      type: boolean
    metadata:
      role: observation
      unit: '1'
      time_semantics: explicit canonical model computation and half-open validity
  - id: packs.restriction.start_ns
    type: agp:type:ActivityRestriction
    schema: *id003
    metadata:
      role: observation
      unit: ns
      time_semantics: explicit canonical model computation and half-open validity
  - id: packs.restriction.end_ns
    type: agp:type:ActivityRestriction
    schema: *id003
    metadata:
      role: observation
      unit: ns
      time_semantics: explicit canonical model computation and half-open validity
  - id: packs.restriction.lower
    type: agp:type:ActivityRestriction
    schema: *id002
    metadata:
      role: observation
      unit: m
      time_semantics: explicit canonical model computation and half-open validity
      frame: enu
      transform_revision: packs.local/v1
  - id: packs.restriction.upper
    type: agp:type:ActivityRestriction
    schema: *id002
    metadata:
      role: observation
      unit: m
      time_semantics: explicit canonical model computation and half-open validity
      frame: enu
      transform_revision: packs.local/v1
  - id: packs.restriction.activities
    type: agp:type:ActivityRestriction
    schema:
      type: array
      items: &id004
        type: string
    metadata:
      role: observation
      unit: '1'
      time_semantics: explicit canonical model computation and half-open validity
  - id: packs.order.state
    type: oo:Order
    schema: *id004
    metadata:
      role: observation
      unit: '1'
      time_semantics: explicit canonical model computation and half-open validity
  - id: packs.order.review
    type: oo:Order
    schema: *id004
    metadata:
      role: observation
      unit: '1'
      time_semantics: explicit canonical model computation and half-open validity
  - id: e1.px4.velocity
    type: aas:Carrier
    schema:
      type: vector
      items:
        type: number
      length: 3
    metadata:
      role: observation
      time_semantics: backend boundary observation; MAVSDK source acquisition unavailable
      frame: enu
  - id: e1.px4.attitude
    type: aas:Carrier
    schema:
      type: vector
      items:
        type: number
      length: 4
    metadata:
      role: observation
      time_semantics: backend boundary observation; MAVSDK source acquisition unavailable
      frame: enu
  - id: e1.px4.battery
    type: aas:Carrier
    schema:
      type: record
      members:
        remaining_fraction: &id005
          type: number
        voltage_v: *id005
      required:
      - remaining_fraction
      - voltage_v
      extra: false
    metadata:
      role: observation
      time_semantics: backend boundary observation; MAVSDK source acquisition unavailable
  - id: e1.px4.armed
    type: aas:Carrier
    schema:
      type: boolean
    metadata:
      role: observation
      time_semantics: backend boundary observation; MAVSDK source acquisition unavailable
  - id: e1.px4.mode
    type: aas:Carrier
    schema:
      type: string
    metadata:
      role: observation
      time_semantics: backend boundary observation; MAVSDK source acquisition unavailable
  - id: e1.px4.landed
    type: aas:Carrier
    schema:
      type: string
    metadata:
      role: observation
      time_semantics: backend boundary observation; MAVSDK source acquisition unavailable
  - id: packs.flight.phase
    type: aas:Carrier
    schema:
      type: string
    metadata:
      role: state
      time_semantics: canonical workflow phase from native command receipts
  messages:
  - id: packs.motion.move_to
    kind: command
    schema:
      type: record
      members:
        entity: *id004
        target: *id002
      required:
      - entity
      - target
      extra: false
    result_schema: &id006
      type: record
      members:
        entity: *id004
        position: *id002
        reason: *id004
      required: []
      extra: false
    feedback_schema:
      type: record
      members:
        entity: *id004
        position: *id002
        velocity: *id002
        energy_j: *id001
      required: []
      extra: true
    cancel_support: true
  - id: packs.motion.hold
    kind: command
    schema:
      type: record
      members:
        entity: *id004
      required:
      - entity
      extra: false
    result_schema: *id006
    feedback_schema:
      type: record
      members:
        entity: *id004
        position: *id002
        velocity: *id002
        energy_j: *id001
      required: []
      extra: true
    cancel_support: true
  - id: packs.motion.stop
    kind: command
    schema:
      type: record
      members:
        entity: *id004
      required:
      - entity
      extra: false
    result_schema: *id006
    feedback_schema:
      type: record
      members:
        entity: *id004
        position: *id002
        velocity: *id002
        energy_j: *id001
      required: []
      extra: true
    cancel_support: true
  - id: packs.motion.arrived
    kind: event
    schema:
      type: record
      members:
        entity: *id004
        position: *id002
      required:
      - entity
      - position
      extra: false
  - id: packs.logistics.transition
    kind: event
    schema:
      type: record
      members:
        order: *id004
        state: *id004
        carrier:
          type: string
          nullable: true
        release_ns:
          type: integer
          minimum: 0
          nullable: true
        deadline_ns: *id003
        energy_start_j: *id001
        energy_used_j: *id001
        reason: *id004
      required:
      - order
      - state
      - carrier
      - release_ns
      - deadline_ns
      extra: false
  - id: packs.business.decision
    kind: event
    schema:
      type: record
      members:
        order: *id004
        accepted:
          type: boolean
      required:
      - order
      - accepted
      extra: false
  - id: packs.logistics.assign
    kind: command
    schema:
      type: record
      members:
        order: *id004
        carrier: *id004
      required:
      - order
      - carrier
      extra: false
    result_schema:
      type: record
      members:
        reason: *id004
      required: []
      extra: false
  - id: packs.logistics.decide
    kind: command
