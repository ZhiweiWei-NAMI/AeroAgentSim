bindings:
  rules:
  - writer: motion
    type: aas:Carrier
    fields:
    - he.aircraft.position_enu_m
    - packs.velocity
    - packs.energy
  - writer: logistics
    type: oo:Order
    fields:
    - packs.order.state
  - writer: logistics
    type: aas:Facility
    fields:
    - packs.facility.position
    - packs.facility.pad_capacity
    - packs.facility.locker_capacity
    - packs.facility.dwell_ns
  - writer: logistics
    type: agp:type:ActivityRestriction
    fields:
    - packs.restriction.active
    - packs.restriction.start_ns
    - packs.restriction.end_ns
    - packs.restriction.lower
    - packs.restriction.upper
    - packs.restriction.activities
  - writer: acceptance
    type: oo:Order
    fields:
    - packs.order.review
  lifecycle:
  - controller: motion
    type: aas:Carrier
  - controller: logistics
    type: oo:Order
  - controller: logistics
    type: aas:Parcel
  - controller: logistics
    type: aas:Facility
  - controller: logistics
    type: agp:type:ActivityRestriction
  relations:
  - writer: logistics
    relation: packs.parcel.custodian
    type: aas:Parcel
  commands: []
engines:
  motion:
    plugin: kinematic
    config:
      model: enu_point_mass
      type_id: aas:Carrier
      position_field: he.aircraft.position_enu_m
      velocity_field: packs.velocity
      energy_field: packs.energy
      max_speed_m_s: 10.0
      max_accel_m_s2: 5.0
      energy:
        capacity_j: 100000.0
        idle_w: 10.0
        per_m_j: 2.0
      commands:
        move_to: packs.motion.move_to
        hold: packs.motion.hold
        stop: packs.motion.stop
      arrival_schema: packs.motion.arrived
      arrival_topic: motion-arrivals
      arrival_payload:
        entity: $entity
        position: $position
      result_fields:
        entity: entity
        position: position
        reason: reason
      step_ns: 200000000
      lifecycle: true
      frame:
        convention: enu
        unit: m
        transform_revision: packs.local/v1
  logistics:
    plugin: logistics
    config:
      fields:
        position: he.aircraft.position_enu_m
        velocity: packs.velocity
        energy: packs.energy
        state: packs.order.state
        facility_position: packs.facility.position
        pad_capacity: packs.facility.pad_capacity
        locker_capacity: packs.facility.locker_capacity
        dwell_ns: packs.facility.dwell_ns
        restriction_active: packs.restriction.active
        restriction_start_ns: packs.restriction.start_ns
        restriction_end_ns: packs.restriction.end_ns
        restriction_lower: packs.restriction.lower
        restriction_upper: packs.restriction.upper
        restriction_activities: packs.restriction.activities
      produces:
      - packs.order.state
      - packs.facility.position
      - packs.facility.pad_capacity
      - packs.facility.locker_capacity
      - packs.facility.dwell_ns
      - packs.restriction.active
      - packs.restriction.start_ns
      - packs.restriction.end_ns
      - packs.restriction.lower
      - packs.restriction.upper
      - packs.restriction.activities
      consumes:
