        field: aas.p1.order_state
        initial: submitted
        states:
          submitted:
            transitions:
            - to: executing
              timer_ns: 10000000
          executing:
            on_enter:
            - kind: command
              schema: aas.motion.move_to
              target: motion
              payload:
                entity: uav-1
                machine: order-1
                target:
                - 30.0
                - 0.0
                - 10.0
                subject:
                  $ref:
                    run_id: p1-slice
                    epoch: '0'
                    id: uav-1
                    generation: 0
                    type_id: oo:UAV
              id: order-1/0/move
            transitions:
            - to: awaiting_acceptance
