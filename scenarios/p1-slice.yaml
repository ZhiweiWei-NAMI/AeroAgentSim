bindings:
  rules:
  - writer: motion
    type: oo:UAV
    fields:
    - he.aircraft.position_enu_m
    - aas.p1.velocity_enu_m_s
    - aas.p1.energy_j
  - writer: operations
    type: oo:Order
    fields:
    - aas.p1.order_state
  - writer: observations
    type: aas:KinematicObservation
    fields:
    - oo:shared.observationRecord.acquisitionTime
    - oo:shared.observationRecord.availableTime
    - oo:shared.observationRecord.observedSubjectRef
    - aas.p1.position_sample
  - writer: acceptance
    type: oo:Order
    fields:
    - aas.p1.acceptance_state
  lifecycle:
  - controller: motion
    type: oo:UAV
  - controller: operations
    type: oo:Order
  - controller: observations
    type: aas:KinematicObservation
    ids: obs/*
  relations:
  - writer: observations
    relation: oo:relation:observation-subject
    type: aas:KinematicObservation
    ids: obs/*
  obligations:
  - controller: observations
    relation: oo:relation:observation-subject
    direction: targets_per_source
    type: aas:KinematicObservation
    ids: obs/*
  samples:
  - context: aas.p1.reached_x
    partition: threshold
    upstream:
    - motion
    - operations
    - observations
    - acceptance
    bindings:
      uav-1: uav-1
      uav-2: uav-2
      uav-3: uav-3
      uav-4: uav-4
      uav-5: uav-5
    sources:
      uav-1: motion
      uav-2: motion
      uav-3: motion
      uav-4: motion
      uav-5: motion
    clocks:
      uav-1:
      - canonical
      - canonical
      uav-2:
      - canonical
      - canonical
      uav-3:
      - canonical
      - canonical
      uav-4:
      - canonical
      - canonical
      uav-5:
      - canonical
      - canonical
    parameters:
      thresholdXM: 10.0
engines:
  motion:
    plugin: kinematic
    config:
      type_id: oo:UAV
      position_field: he.aircraft.position_enu_m
      velocity_field: aas.p1.velocity_enu_m_s
      energy_field: aas.p1.energy_j
      step_ns: 100000000
      frame:
        convention: enu
        unit: m
        transform_revision: p1-local-1
      max_speed_m_s: 10.0
      max_accel_m_s2: 5.0
      energy:
        capacity_j: 100000.0
        idle_w: 20.0
        per_m_j: 5.0
      commands:
        move_to: aas.motion.move_to
        hold: aas.motion.hold
        stop: aas.motion.stop
      arrival_schema: aas.motion.arrived
      arrival_topic: arrival
      lifecycle: true
      model: enu_point_mass
      arrival_payload:
        entity: $entity
        position: $position
        machine: $payload.machine
      result_fields:
        entity: entity
        position: position
        reason: reason
  operations:
    plugin: workflow
    config:
      produces:
      - aas.p1.order_state
      consumes: []
      emits:
