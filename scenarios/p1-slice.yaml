format: aeroagentsim.scenario/v1
id: p1-slice
# Public profile: committed snapshot plus explicitly authored scenario contracts.
# These overlays do not claim to reproduce the full AeroGraph catalog.
registry:
  types:
  - id: aas:KinematicObservation
    parents:
    - oo:MetricObservation
    abstract: false
  - id: oo:MetricObservation
    parents:
    - oo:ObservationRecord
    abstract: false
  fields:
  - id: oo:shared.observationRecord.acquisitionTime
    type: oo:ObservationRecord
    schema: &id001
      type: record
      members:
        clockRef:
          type: string
        value:
          type: number
      required:
      - clockRef
      - value
      extra: false
    metadata:
      role: observation
      clock: canonical
      unit: s
  - id: oo:shared.observationRecord.availableTime
    type: oo:ObservationRecord
    schema: *id001
    metadata:
      role: observation
      clock: canonical
      unit: s
  - id: oo:shared.observationRecord.observedSubjectRef
    type: oo:ObservationRecord
    schema:
      type: ref
      target_type: oo:ModelObject
    metadata:
      role: observation
      clock: canonical
  - id: aas.p1.velocity_enu_m_s
    type: oo:UAV
    schema: &id002
      type: vector
      items:
        type: number
      length: 3
    metadata:
      unit: m/s
      frame: enu
      role: derived
      clock: canonical
  - id: aas.p1.energy_j
    type: oo:UAV
    schema:
      type: number
    metadata:
      unit: J
      role: derived
      clock: canonical
  - id: aas.p1.order_state
    type: oo:Order
    schema:
      type: string
      enum:
      - submitted
      - executing
      - awaiting_acceptance
      - accepted
      - failed
      - canceled
    metadata:
      role: state
      clock: canonical
  - id: aas.p1.position_sample
    type: aas:KinematicObservation
    schema: *id002
    metadata:
      unit: m
      frame: enu
      role: observation
      clock: canonical
  - id: aas.p1.acceptance_state
    type: oo:Order
    schema:
      type: string
      enum:
      - pending
      - reviewing
      - acknowledged
    metadata:
      role: state
      clock: canonical
  messages:
  - id: aas.motion.move_to
    kind: command
    schema:
      type: record
      members:
        entity: &id003
          type: string
        machine: *id003
        target: *id002
        subject:
          type: ref
          target_type: oo:UAV
      required:
      - entity
      - machine
      - target
      extra: false
    result_schema: &id004
      type: record
      members:
        entity: *id003
        position: *id002
        reason: *id003
      required: []
      extra: false
    feedback_schema: *id004
    cancel_support: true
  - id: aas.motion.hold
    kind: command
    schema: &id005
      type: record
      members:
        entity: *id003
        machine: *id003
        subject:
          type: ref
          target_type: oo:UAV
      required:
      - entity
      - machine
      extra: false
    result_schema: *id004
    feedback_schema: *id004
    cancel_support: true
  - id: aas.motion.stop
    kind: command
    schema: *id005
    result_schema: *id004
    feedback_schema: *id004
    cancel_support: true
  - id: aas.motion.arrived
    kind: event
    schema:
      type: record
      members:
        entity: *id003
        machine: *id003
        position: *id002
      required:
      - entity
      - machine
      - position
      extra: false
  - id: aas.business.accepted
    kind: event
    schema:
      type: record
      members:
        machine: *id003
      required:
      - machine
      extra: false
  - id: aas.p1.reached_x
    kind: event
    schema:
      type: record
      members:
        entity: *id003
        from_ns: &id006
          type: integer
        to_ns: *id006
      required:
      - entity
      - from_ns
      - to_ns
      extra: false
  relations:
  - id: oo:relation:observation-subject
    source_type: oo:ObservationRecord
    target_type: oo:ModelObject
    targets_per_source:
      minimum: 1
      maximum: 1
    sources_per_target:
      minimum: 0
      maximum: null
    identity_policy: edge_id
    metadata:
      inverse_policy: authored unconstrained many records per subject; source declares
        no inverse direction
      reviewStatus: proposed
  field_metadata:
    he.aircraft.position_enu_m:
      frame: enu
      transform_revision: p1-local-1
  snapshot: packs/aerograph.snapshot.json
