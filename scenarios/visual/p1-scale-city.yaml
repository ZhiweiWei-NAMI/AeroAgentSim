# Display study: maps unchanged local trajectories to the declared Huangpu anchor.
# City is context only; this scenario does not model city obstacle avoidance.
format: aeroagentsim.scenario/v1
id: p1-scale
registry:
  compile:
    root: ${AEROAGENTSIM_AEROGRAPH_ROOT}
    types:
    - oo:UAV
    fields:
    - he.aircraft.position_enu_m
    relations: []
  types: []
  fields:
  - id: aas.p1.velocity_enu_m_s
    type: oo:UAV
    schema: &id002
      type: vector
      items:
        type: number
      length: 3
    metadata:
      unit: m/s
      frame: enu
      role: derived
      clock: canonical
  - id: aas.p1.energy_j
    type: oo:UAV
    schema:
      type: number
    metadata:
      unit: J
      role: derived
      clock: canonical
  messages:
  - id: aas.motion.move_to
    kind: command
    schema:
      type: record
      members:
        entity: &id001
          type: string
        machine: *id001
        target: *id002
        subject:
          type: ref
          target_type: oo:UAV
      required:
      - entity
      - machine
      - target
      extra: false
    result_schema: &id003
      type: record
      members:
        entity: *id001
        position: *id002
        reason: *id001
      required: []
      extra: false
    feedback_schema: *id003
    cancel_support: true
  - id: aas.motion.hold
    kind: command
    schema: &id004
      type: record
      members:
        entity: *id001
        machine: *id001
        subject:
          type: ref
          target_type: oo:UAV
      required:
      - entity
      - machine
      extra: false
    result_schema: *id003
    feedback_schema: *id003
    cancel_support: true
  - id: aas.motion.stop
    kind: command
    schema: *id004
    result_schema: *id003
    feedback_schema: *id003
    cancel_support: true
  - id: aas.motion.arrived
    kind: event
    schema:
      type: record
      members:
        entity: *id001
        machine: *id001
        position: *id002
      required:
      - entity
      - machine
      - position
      extra: false
  - id: aas.business.accepted
    kind: event
    schema:
      type: record
      members:
        machine: *id001
      required:
      - machine
      extra: false
  - id: aas.p1.reached_x
    kind: event
    schema:
      type: record
      members:
        entity: *id001
        from_ns: &id005
          type: integer
        to_ns: *id005
      required:
      - entity
      - from_ns
      - to_ns
      extra: false
  relations: []
  field_metadata:
    he.aircraft.position_enu_m:
      frame: enu
      transform_revision: p1-local-1
