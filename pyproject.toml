[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aeroagentsim"
version = "2.1.0"
description = "General-purpose ontology-driven multi-engine simulation platform"
readme = "README.md"
authors = [
    {name = "Zhiwei Wei", email = "2311769@tongji.edu.cn"}
]
requires-python = ">=3.10"
dependencies = ["aerokernel>=0.2.0,<0.3", "pyyaml>=6"]

[project.optional-dependencies]
langgraph = ["langgraph>=1.2.14,<2"]
agents = ["langgraph>=1.2.14,<2", "openai>=1"]
# CI-validated compatible range: Starlette >=1.8 removes the TestClient httpx
# fallback (httpx2 becomes mandatory), so cap Starlette below 1.8 explicitly --
# FastAPI's own metadata has no Starlette upper bound.
server = [
    "fastapi>=0.115,<0.144",
    "starlette>=0.46,<1.8",
    "uvicorn>=0.30",
]
dev = [
    "pytest", "hypothesis", "pytest-cov", "pytest-asyncio",
    # fastapi/starlette TestClient stack. Starlette >=1.7 prefers the httpx2
    # package (httpx-only is deprecated there and unsupported after 1.7), and
    # Starlette's own "full" extra pairs httpx2>=2 with httpx>=0.27,<0.29.
    "httpx2>=2,<3",
    "httpx>=0.27,<0.29",
    "ruff", "mypy", "types-PyYAML",
]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme",
    "sphinx-autodoc-typehints",
    "myst-parser",
    "sphinx-copybutton"
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["aeroagentsim", "aeroagentsim.*"]

[project.scripts]
aeroagentsim = "aeroagentsim.services.cli:main"

# Install the included kernel and platform together:
# python -m pip install -e ./aerokernel -e '.[server]'.
[project.entry-points."aeroagentsim.engines"]
lowalt_tasks = "aeroagentsim.packs.lowalt.tasks:build"
lowalt_incident_capture = "aeroagentsim.packs.lowalt.incident_capture:build"
lowalt_city_capture = "aeroagentsim.packs.lowalt.city_capture:build"
lowalt_airspace = "aeroagentsim.packs.lowalt.airspace:build"
lowalt_energy = "aeroagentsim.packs.lowalt.energy:build"
behaviour = "aeroagentsim.engines.behaviour:build"
px4_gazebo = "aeroagentsim.adapters.px4_gazebo:build"
sumo = "aeroagentsim.adapters.sumo:build"
ns3 = "aeroagentsim.adapters.ns3:build"
environment = "aeroagentsim.engines.environment:build"
langgraph = "aeroagentsim.agents.langgraph:build"
predicate = "aeroagentsim.engines.predicate:build"
capture = "aeroagentsim.observations.capture:build"
traffic_road_motion = "aeroagentsim.packs.traffic_accident.road_motion:build"
traffic_route_inputs = "aeroagentsim.packs.traffic_accident.route_inputs:build"
traffic_assessment = "aeroagentsim.packs.traffic_accident.traffic_assessment:build"
traffic_decisions = "aeroagentsim.packs.traffic_accident.decisions:build"
traffic_decision_failures = "aeroagentsim.packs.traffic_accident.decision_failures:build"
traffic_capture_bridge = "aeroagentsim.packs.traffic_accident.capture:build"
traffic_camera_capture = "aeroagentsim.packs.traffic_accident.camera:build"


[project.entry-points."aeroagentsim.algorithms"]
"allocation.nearest" = "aeroagentsim.algorithms.builtins:Nearest"
"allocation.auction" = "aeroagentsim.algorithms.builtins:Auction"
"allocation.hungarian" = "aeroagentsim.algorithms.builtins:Hungarian"
"path_planning.straight" = "aeroagentsim.algorithms.builtins:Straight"
"path_planning.corridor_astar" = "aeroagentsim.algorithms.builtins:CorridorAstar"
"path_planning.coverage" = "aeroagentsim.algorithms.routes:Coverage"
"path_planning.survey" = "aeroagentsim.algorithms.routes:SurveyRoute"
"path_planning.patrol" = "aeroagentsim.algorithms.routes:PatrolRoute"
"conflict_resolution.altitude_layers" = "aeroagentsim.algorithms.builtins:AltitudeLayers"
"conflict_resolution.hold_and_go" = "aeroagentsim.algorithms.builtins:HoldAndGo"
"charging.threshold_return" = "aeroagentsim.algorithms.builtins:ThresholdReturn"
"allocation.llm" = "aeroagentsim.algorithms.llm:LLMAllocation"

[project.entry-points."aeroagentsim.models"]
linear = "aeroagentsim.models:LinearConsumption"
wind = "aeroagentsim.models:WindConsumption"

[tool.uv.sources]
aerokernel = {path = "./aerokernel", editable = true}

[tool.setuptools.package-data]
"aeroagentsim.observations" = ["viewer_bridge.mjs"]
"aeroagentsim.packs.traffic_accident" = ["camera.html"]
"aeroagentsim.packs.lowalt" = ["registry.overlay.yaml", "registry.snapshot.json", "cooperation.snapshot.json"]
"aeroagentsim.authoring" = ["assets/*.xml", "assets/*.json", "assets/*.txt"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
# The kernel is a separately installed distribution, including in this subtree.
known-third-party = ["aerokernel"]
