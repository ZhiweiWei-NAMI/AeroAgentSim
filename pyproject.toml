[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airfogsim"
version = "0.1.0"
description = "Low Altitude Space Simulation System"
readme = "README.md"
authors = [
    {name = "Zhiwei Wei", email = "2311769@tongji.edu.cn"}
]
requires-python = ">=3.8"
dependencies = [
    "simpy",
    "numpy",
    "pint",
    "python-dotenv",
    "gunicorn",
    "requests",
    "pandas",
    "openai",
    "tqdm",
    "fastapi",
    "tabulate",
    "pydantic",
    "uvicorn"
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["airfogsim"]