[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aeroagentsim"
version = "1.1.1"
description = "General-purpose ontology-driven multi-engine simulation platform"
readme = "README.md"
authors = [
    {name = "Zhiwei Wei", email = "2311769@tongji.edu.cn"}
]
requires-python = ">=3.10"
dependencies = ["aerokernel>=0.1.0.dev0,<0.2", "pyyaml>=6"]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.30"]
legacy = [
    "simpy>=4", "numpy", "pint", "python-dotenv", "requests", "pandas",
    "matplotlib",
    "openai", "tqdm", "fastapi>=0.115", "tabulate", "pydantic>=2",
    "uvicorn>=0.30",
]
dev = [
    "pytest", "hypothesis", "pytest-cov", "pytest-asyncio", "httpx",
    "ruff", "mypy", "types-PyYAML",
]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme",
    "sphinx-autodoc-typehints",
    "myst-parser",
    "sphinx-copybutton"
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["aeroagentsim", "aeroagentsim.*", "airfogsim"]

[project.scripts]
airfogsim = "aeroagentsim.cli:main"
aeroagentsim = "aeroagentsim.services.cli:main"

# Editable local development: pip install -e ../aerokernel -e '.[server]'.
# PEP 508 has no portable relative path. The version requirement above is
# satisfied by that sibling checkout; release publication requires a published
# matching kernel, or an immutable VCS URL configured by the release owner.
[project.entry-points."aeroagentsim.engines"]
px4_gazebo = "aeroagentsim.adapters.px4_gazebo:build"
sumo = "aeroagentsim.adapters.sumo:build"
ns3 = "aeroagentsim.adapters.ns3:build"

[tool.uv.sources]
aerokernel = {path = "../aerokernel", editable = true}
