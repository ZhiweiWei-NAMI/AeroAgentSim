[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aeroagentsim"
version = "1.1.1"
description = "Discrete-event simulation and developer workbench for low-altitude autonomous systems"
readme = "README.md"
authors = [
    {name = "Zhiwei Wei", email = "2311769@tongji.edu.cn"}
]
requires-python = ">=3.10"
dependencies = ["aerokernel>=0.1.0.dev0,<0.2", "pyyaml>=6"]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.30"]
legacy = [
    "simpy",
    "numpy",
    "pint",
    "python-dotenv",
    "gunicorn", # 用于生产 Docker
    "requests",
    "pandas",
    "openai",
    "tqdm",
    "fastapi",
    "tabulate",
    "pydantic",
    "uvicorn[standard]", # 添加 uvicorn, [standard] 包含性能优化库
    "pyyaml" # 用于YAML配置文件解析
]

dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "black",
    "flake8",
    "pip-tools"
]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme",
    "sphinx-autodoc-typehints",
    "myst-parser",
    "sphinx-copybutton"
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["aeroagentsim", "aeroagentsim.*", "airfogsim"]

[project.scripts]
airfogsim = "aeroagentsim.cli:main"
aeroagentsim = "aeroagentsim.services.cli:main"
