[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aerokernel"
readme = "README.md"
description = "Pure-stdlib discrete-event runtime with coordinated heterogeneous engines"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest", "hypothesis", "pytest-cov"]

[tool.setuptools]
# A plain editable search path keeps the inner package importable when the
# containing subtree directory is also visible from the platform repository.
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["aerokernel*"]

[tool.ruff]
target-version = "py310"
line-length = 88
include = ["aerokernel/**/*.py", "tests/kernel/**/*.py", "examples/**/*.py", "benchmarks/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["aerokernel"]

[tool.setuptools.package-data]
aerokernel = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not perf'"
markers = ["perf: opt-in host performance smoke tests (run with -m perf)"]
cache_dir = "tests/.pytest_cache"
