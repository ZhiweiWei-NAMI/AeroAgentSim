[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aerorescue"
version = "0.1.0"
description = "Cordis-owned rescue application on AeroAgentSim native execution"
requires-python = ">=3.10"
dependencies = ["aeroagentsim>=2.1,<3", "pyyaml>=6", "numpy>=1.24"]

[project.scripts]
aerorescue-tools = "aerorescue.companion.tools:main"
aerorescue-coordinator = "aerorescue.companion.coordinator:main"
aerorescue-worker = "aerorescue.companion.runtime:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aerorescue", "aerorescue.*"]

[tool.setuptools.package-data]
"aerorescue.resources" = ["adapters/*", "SOURCE.md", "scenarios/*", "skills/*/*"]
