- insert:
    - id: aerorescue-llm
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers:
          rescue-model:
            displayName: AeroRescue model endpoint
            api: openai-completions
            baseURL: !!js process.env.AAS_LLM_BASE_URL
            apiKeyEnv: !!js process.env.AAS_LLM_API_KEY ? 'AAS_LLM_API_KEY' : undefined
            models:
              - id: !!js process.env.AAS_LLM_MODEL
                contextWindow: !!js Number(process.env.AAS_LLM_CONTEXT_WINDOW || 32768)
