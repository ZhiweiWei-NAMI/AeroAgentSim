version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airfogsim_backend
    # 在生产环境中，通常不挂载代码卷，以确保镜像是不可变的
    # volumes:
    #   - ./src:/app/src
    #   - ./main_for_visualization.py:/app/main_for_visualization.py
    # 如果需要持久化数据 (例如数据库文件)，请定义 volume
    # volumes:
    #   - backend_data:/app/data
    environment:
      # 设置后端需要的环境变量，例如数据库连接、密钥等
      # 这些值可以通过 .env 文件或直接在这里设置
      PYTHONUNBUFFERED: 1 # 确保 Python 输出直接显示，方便调试
      # EXAMPLE_VAR: ${EXAMPLE_VAR_FROM_ENV_FILE} # 也可以从运行 docker-compose 的环境继承变量
    # 使用 env_file 指令加载主机上的 .env 文件到容器环境中
    # 确保此 .env 文件与 docker-compose.yml 在同一目录
    env_file:
    #   - .env # 加载项目根目录下的 .env 文件 (如果存在)
    # ports:
      # 不直接暴露后端端口给主机，由 Nginx 代理
      # - "8000:8000" # 仅用于本地调试时直接访问后端
    restart: unless-stopped
    # (可选) 健康检查，确保后端服务正常运行
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:8000/health"] # 假设你有 /health 端点
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3

  # 注意：此配置依赖于你先在本地运行 `npm run build` (在 frontend 目录下)
  # 来生成 `frontend/build` 目录。Nginx 服务会挂载这个本地目录。
  # 或者，你可以修改 nginx 服务，让它从一个构建阶段复制文件。
  nginx:
    image: nginx:stable-alpine
    container_name: airfogsim_nginx
    ports:
      - "80:80" # 将主机的 80 端口映射到 Nginx 容器的 80 端口
      # 如果需要 HTTPS，可以映射 443 端口并配置 SSL/TLS
      # - "443:443"
    volumes:
      # 挂载本地构建好的前端静态文件到 Nginx 的服务目录
      # 重要：运行 docker-compose up 之前，确保 frontend/build 目录存在且包含构建产物
      - ./frontend/build:/usr/share/nginx/html:ro
      # 挂载自定义的 Nginx 配置文件
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # (可选) 如果需要 HTTPS，挂载 SSL 证书
      # - ./certs:/etc/nginx/certs:ro
    depends_on:
      # 确保后端服务先启动 (但不保证后端完全可用，可能需要健康检查或等待脚本)
      - backend
    restart: unless-stopped

# (可选) 定义持久化数据卷
# volumes:
#   backend_data: