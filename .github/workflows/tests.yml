name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Set AEROKERNEL_REPOSITORY (owner/repo) and AEROKERNEL_REF (compatible commit)
# repository variables. The kernel is independently versioned, not vendored.
# A submodule checkout at ../aerokernel can replace the second checkout below.
jobs:
  non-docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      HYPOTHESIS_STORAGE_DIRECTORY: /tmp/aas-ci/hypothesis
    steps:
      - uses: actions/checkout@v4
        with:
          path: platform
      - name: Require independent kernel checkout configuration
        env:
          KERNEL_REPOSITORY: ${{ vars.AEROKERNEL_REPOSITORY }}
          KERNEL_REF: ${{ vars.AEROKERNEL_REF }}
        run: |
          test -n "$KERNEL_REPOSITORY" && test -n "$KERNEL_REF" || {
            echo 'Set AEROKERNEL_REPOSITORY and AEROKERNEL_REF; see INSTALL.md.'
            exit 1
          }
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.AEROKERNEL_REPOSITORY }}
          token: ${{ secrets.KERNEL_READ_TOKEN || github.token }}
          ref: ${{ vars.AEROKERNEL_REF }}
          path: aerokernel
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install minimal platform and test tools
        working-directory: platform
        run: python -m pip install -e ../aerokernel -e '.[server,dev]'
      - name: Independent non-Docker tests
        working-directory: platform
        run: |
          python -m pytest tests/integrations/aerograph tests/adapters tests/packs \
            tests/agents/test_provider.py tests/test_core/test_compatibility.py \
            -m 'not docker and not llm and not legacy' -p no:cacheprovider \
            --basetemp=/tmp/aas-ci/tests
      - name: CLI and packaging
        working-directory: platform
        run: |
          python -m pip check
          aeroagentsim serve --help
          python -c "from aeroagentsim import Simulation; import sys; assert not any(m.startswith(('airfogsim', 'aero_bench', 'simpy')) for m in sys.modules)"

  # Full P1/decision gates use the pinned real AeroGraph files (read-only).
  # Their scenarios currently encode /mnt/data2/weizhiwei/AeroGraph. Enable
  # this job when a matching source revision is available to CI.
  aerograph:
    needs: non-docker
    if: ${{ vars.AEROGRAPH_REPOSITORY != '' && vars.AEROGRAPH_REF != '' }}
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      HYPOTHESIS_STORAGE_DIRECTORY: /tmp/aas-ci-graph/hypothesis
    steps:
      - uses: actions/checkout@v4
        with:
          path: platform
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.AEROKERNEL_REPOSITORY }}
          token: ${{ secrets.KERNEL_READ_TOKEN || github.token }}
          ref: ${{ vars.AEROKERNEL_REF }}
          path: aerokernel
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.AEROGRAPH_REPOSITORY }}
          token: ${{ secrets.AEROGRAPH_READ_TOKEN || github.token }}
          ref: ${{ vars.AEROGRAPH_REF }}
          path: aerograph
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and expose read-only source layout
        working-directory: platform
        run: |
          python -m pip install -e ../aerokernel -e '.[server,dev]'
          sudo mkdir -p /mnt/data2/weizhiwei
          sudo ln -s "$GITHUB_WORKSPACE/aerograph" /mnt/data2/weizhiwei/AeroGraph
      - name: Full platform and decision tests without Docker or model calls
        working-directory: platform
        run: |
          python -m pytest tests/platform tests/agents tests/integrations/aerograph \
            -m 'not docker and not llm' -p no:cacheprovider \
            --basetemp=/tmp/aas-ci-graph/tests
