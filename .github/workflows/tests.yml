name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  non-docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: platform
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install minimal platform and test tools
        working-directory: platform
        run: |
          python -m pip install -e "./aerokernel[test]" -e '.[server,dev,agents]' -c constraints/dev.txt
          python -m pip install pytest-github-actions-annotate-failures
      - name: Install console and camera dependencies
        working-directory: platform/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node -e "console.log('AEROAGENTSIM_CHROMIUM=' + require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"
          npm run build
      - name: Current frontend tests
        working-directory: platform/frontend
        run: |
          npm run typecheck
          npm test
      - name: Assistant conversation through the workbench
        if: matrix.python-version == '3.11'
        working-directory: platform/frontend
        run: AEROAGENTSIM_PYTHON=$(command -v python) npm run test:e2e -- e2e/assistant.spec.ts
      - name: Independent non-Docker tests
        working-directory: platform
        env:
          HYPOTHESIS_STORAGE_DIRECTORY: ${{ runner.temp }}/platform/hypothesis
        run: |
          # Canonical-source compatibility cases run in the AeroGraph job below.
          python -m pytest tests/platform tests/integrations/aerograph/test_compiler.py \
            tests/adapters tests/agents tests/assistant tests/behaviours \
            tests/observations tests/packs tests/services tests/authoring \
            tests/runs tests/product tests/contracts \
            --ignore=tests/authoring/test_contracts.py \
            --ignore=tests/authoring/test_replay_scene.py \
            tests/demos/traffic_accident/test_public_demo.py \
            tests/demos/traffic_accident/test_packaging.py \
            tests/demos/traffic_accident/test_air.py \
            tests/demos/traffic_accident/test_live_decisions.py \
            tests/demos/traffic_accident/test_policy.py \
            tests/demos/traffic_accident/test_road.py \
            tests/demos/traffic_accident/test_runtime_contract.py \
            tests/demos/traffic_accident/test_scenario.py \
            --deselect=tests/observations/test_artifact_service.py::test_service_output_scope_without_mutating_input \
            --deselect=tests/authoring/test_portable_yaml.py::test_region_roundtrip_preserves_parameters_geometry_crop_and_real_network \
            --deselect=tests/assistant/test_blank_projects.py::test_blank_centre_charging_station_compiles_validates_and_applies[aerograph] \
            -m 'not docker and not llm' -p no:cacheprovider \
            --basetemp=${{ runner.temp }}/platform/tests
      - name: Kernel test suite
        working-directory: platform/aerokernel
        run: python -m pytest -q -rf
      - name: CLI and packaging
        working-directory: platform
        run: |
          python -m pip check
          aeroagentsim serve --help
          aeroagentsim plugins > /dev/null
          python tools/docs/check_links.py
          python -c "from aeroagentsim import Simulation; import sys; assert not any(m.startswith(('airfogsim', 'aero_bench', 'simpy')) for m in sys.modules)"

  # Source-dependent suites use the pinned real AeroGraph files (read-only).
  # Public runtime, behaviour and replay suites run unconditionally above.
  aerograph:
    needs: non-docker
    if: ${{ vars.AEROGRAPH_REPOSITORY != '' && vars.AEROGRAPH_REF != '' }}
    runs-on: ubuntu-latest
    env:
      AEROAGENTSIM_AEROGRAPH_ROOT: ${{ github.workspace }}/aerograph
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: platform
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.AEROGRAPH_REPOSITORY }}
          token: ${{ secrets.AEROGRAPH_READ_TOKEN || github.token }}
          ref: ${{ vars.AEROGRAPH_REF }}
          path: aerograph
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install platform and kernel
        working-directory: platform
        run: |
          python -m pip install -e "./aerokernel[test]" -e '.[server,dev]' -c constraints/dev.txt
      - name: Install camera dependencies
        working-directory: platform/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node -e "console.log('AEROAGENTSIM_CHROMIUM=' + require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"
          npm run build
      - name: Full platform and decision tests without Docker or model calls
        working-directory: platform
        env:
          HYPOTHESIS_STORAGE_DIRECTORY: ${{ runner.temp }}/platform-graph/hypothesis
        run: |
          python -m pytest tests/platform tests/agents tests/integrations/aerograph \
            tests/assistant/test_blank_projects.py \
            tests/authoring/test_contracts.py tests/authoring/test_replay_scene.py \
            tests/behaviours tests/observations \
            -m 'not docker and not llm' -p no:cacheprovider \
            --basetemp=${{ runner.temp }}/platform-graph/tests
