        priority: 100
        payload_kg: 0.0
        arrivals:
          mode: scheduled
          times_ns:
          - 10000000000000
      work_routes:
        patrol:
          algorithm: patrol
          config:
            waypoints:
            - - -44.494
              - -7.319
              - 125.0
            - - -44.494
              - 46.971000000000004
              - 125.0
            - - 65.81700000000001
              - 46.971000000000004
              - 125.0
            - - 65.81700000000001
              - -7.319
              - 125.0
            cruise_altitude_m: 125.0
      vehicle_kinds:
