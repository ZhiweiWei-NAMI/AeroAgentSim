server {
    listen 80;
    server_name localhost; # 或者你的域名

    # 提供前端静态文件
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # 这个 try_files 指令对于使用 React Router 等前端路由的单页应用 (SPA) 很重要
        # 它确保即使用户直接访问 /some/route，Nginx 也会返回 index.html
        # 然后 React Router 会接管并显示正确的组件
        try_files $uri $uri/ /index.html;
    }

    # 反向代理 API 请求到后端 Gunicorn/Uvicorn 服务
    # 假设你的 API 路由都以 /api/ 开头 (如果不是，请修改)
    # 如果你的前端直接请求后端端口 (如 8000)，则不需要这个 location 块
    # 但通常推荐通过 Nginx 代理以统一入口和简化 CORS 配置
    location /api/ {
        # 'backend' 是下面 docker-compose.yml 中定义的服务名
        # 8000 是后端 Dockerfile 中 EXPOSE 的端口
        proxy_pass http://backend:8000/;

        # 设置必要的头信息，以便后端应用能获取到原始请求信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # (可选) 增加超时时间
        # proxy_connect_timeout       600;
        # proxy_send_timeout          600;
        # proxy_read_timeout          600;
        # send_timeout                600;
    }

    # 处理 WebSocket 连接
    location /ws/ {
        proxy_pass http://backend:8000/ws/; # 代理到后端的 WebSocket 端点
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # 如果需要，可以增加超时时间以保持长连接
        # proxy_read_timeout 86400s;
        # proxy_send_timeout 86400s;
    }

    # 错误页面配置
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}