algorithms:
  allocation: nearest
  charging: threshold_return
  conflict_resolution: hold_and_go
  path_planning: corridor_astar
behaviours:
- bindings:
  - chain: battery_reserve
    id: battery-reserve
    match:
      uav:
        is_a: lowalt:UAV
    multiplicity: once_per_entity
    on_unbind: retain_until_terminal
    variables: {}
  - chain: no_fly_zone
    id: no-fly-zone
    match:
      uav:
        is_a: lowalt:UAV
      zone:
        field: lowalt.zone_kind
        in:
        - no_fly
        - restricted
        is_a: lowalt:AirspaceZone
    multiplicity: once_per_entity
    on_unbind: retain_until_terminal
    variables: {}
  - chain: separation
    id: separation
    match:
      uav:
        is_a: lowalt:UAV
    multiplicity: once_per_entity
    on_unbind: retain_until_terminal
    variables: {}
  - chain: wind_limit
    id: wind-limit
    match:
      uav:
        is_a: lowalt:UAV
    multiplicity: once_per_entity
    on_unbind: retain_until_terminal
    variables: {}
  budgets:
    max_creations_per_instance: 8
    max_instances: 4000
    max_timers_per_instance: 8
    max_transitions_per_instance_per_ns: 64
  chains:
    battery_reserve:
      initial: monitoring
      preconditions: []
      roles:
        uav: lowalt:UAV
      states:
      - monitoring
      - returning
      - waiting
      terminal: []
      transitions:
      - actions: []
        from: monitoring
        id: armed
        'on':
          instance: activated
        priority: 0
        to: monitoring
      - actions:
        - entity:
            $role: uav
          field: lowalt.returning_to_charge
          id: recalling
          kind: set
          value: true
        - id: battery-low
          kind: emit
          payload:
            soc:
              field: lowalt.soc
              path: []
              role: uav
            vehicle:
              $id: uav
          schema: lowalt.energy.low
          topic: lowalt.events
        - capability: lowalt.energy.return_to_pad
          id: recall
          kind: command
          payload:
            reason: battery below reserve
            vehicle:
              $id: uav
        from: monitoring
        id: low
        'on':
          edge: while
          predicate: battery_below_reserve
        priority: 0
        to: returning
      - actions:
        - entity:
            $role: uav
          field: lowalt.returning_to_charge
          id: ready
          kind: set
          value: false
        from: returning
        id: charged
        'on':
          receipt: recall
          status: succeeded
        priority: 0
        to: monitoring
      - actions:
        - entity:
            $role: uav
          field: lowalt.returning_to_charge
          id: recall-rejected
          kind: set
          value: false
        from: returning
        id: recall-failed
        'on':
          receipt: recall
          status:
          - failed
          - rejected
          - canceled
        priority: 0
        to: waiting
      - actions: []
        from: waiting
        id: recharged
        'on':
          edge: exited
          predicate: battery_below_reserve
        priority: 0
        to: monitoring
      trigger:
        instance: activated
    no_fly_zone:
      initial: monitoring
      preconditions: []
      roles:
        uav: lowalt:UAV
        zone: lowalt:AirspaceZone
      states:
      - monitoring
      - rerouting
      terminal: []
      transitions:
      - actions: []
        from: monitoring
        id: armed
        'on':
          instance: activated
        priority: 0
        to: monitoring
      - actions:
        - id: geofence
          kind: emit
          payload:
            vehicle:
              $id: uav
            zone:
              $id: zone
          schema: lowalt.airspace.geofence_entered
          topic: lowalt.events
        - capability: lowalt.airspace.flight_control
          id: reroute
          kind: command
          payload:
            action: reroute
            reason: no-fly zone
            vehicle:
              $id: uav
        from: monitoring
        id: entered-zone
        'on':
          edge: entered
          predicate: inside_no_fly_zone
        priority: 0
        to: rerouting
      - actions: []
        from: rerouting
        id: left-zone
        'on':
          edge: exited
          predicate: inside_no_fly_zone
        priority: 0
        to: monitoring
      trigger:
        instance: activated
    separation:
      initial: monitoring
      preconditions: []
      roles:
        uav: lowalt:UAV
      states:
      - monitoring
      - resolving
      terminal: []
      transitions:
      - actions: []
        from: monitoring
        id: armed
        'on':
          instance: activated
        priority: 0
        to: monitoring
      - actions:
        - id: conflict
          kind: emit
          payload:
            a:
              $id: uav
            b:
              field: lowalt.conflict_partner
              path: []
              role: uav
            horizontal_m:
              field: lowalt.conflict_gap_m
              path:
              - 0
              role: uav
            vertical_m:
              field: lowalt.conflict_gap_m
              path:
              - 1
              role: uav
          schema: lowalt.airspace.conflict
          topic: lowalt.events
        - capability: lowalt.airspace.resolve_conflict
          id: resolve
          kind: command
          payload:
            a:
              $id: uav
            b:
              field: lowalt.conflict_partner
              path: []
              role: uav
        from: monitoring
        id: too-close
        'on':
          edge: while
          predicate: closer_than_safety_distance
        priority: 0
        to: resolving
      - actions:
        - id: resolved
          kind: emit
          payload:
            a:
              $trigger: result.a
            action:
              $trigger: result.action
            b:
              $trigger: result.b
          schema: lowalt.airspace.conflict_resolved
          topic: lowalt.events
        from: resolving
        id: separated
        'on':
          receipt: resolve
          status: succeeded
        priority: 0
        to: monitoring
      - actions: []
        from: resolving
        id: resolve-failed
        'on':
          receipt: resolve
          status:
          - failed
          - rejected
          - canceled
        priority: 0
        to: monitoring
      trigger:
        instance: activated
    wind_limit:
      initial: flying
      preconditions: []
      roles:
        uav: lowalt:UAV
      states:
      - flying
      - held
      terminal: []
      transitions:
      - actions: []
        from: flying
        id: armed
        'on':
          instance: activated
        priority: 0
        to: flying
      - actions:
        - entity:
            $role: uav
          field: lowalt.weather_held
          id: grounded
          kind: set
          value: true
        - id: weather-hold
          kind: emit
          payload:
            reason: wind exceeds vehicle limit
            vehicle:
              $id: uav
            wind_mps:
              field: lowalt.wind_mps
              path: []
              role: uav
          schema: lowalt.weather.hold
          topic: lowalt.events
        - capability: lowalt.airspace.flight_control
          id: hold
          kind: command
          payload:
            action: hold
            reason: weather
            vehicle:
              $id: uav
        from: flying
        id: too-windy
        'on':
          edge: while
          predicate: wind_above_limit
        priority: 0
        to: held
      - actions:
        - entity:
            $role: uav
          field: lowalt.weather_held
          id: cleared
          kind: set
          value: false
        - id: weather-release
          kind: emit
          payload:
            reason: wind within vehicle limit
            vehicle:
              $id: uav
            wind_mps:
              field: lowalt.wind_mps
              path: []
              role: uav
          schema: lowalt.weather.release
          topic: lowalt.events
        - capability: lowalt.airspace.flight_control
          id: release
          kind: command
          payload:
            action: release
            reason: weather
            vehicle:
              $id: uav
        from: held
        id: calm
        'on':
          edge: exited
          predicate: wind_above_limit
        priority: 0
        to: flying
      trigger:
        instance: activated
  evaluator:
    dialect: original
    version: aerograph-predicate/1
  format: aeroagentsim.behaviour-package/v1
  id: lowalt.rules
  predicates:
    battery_below_reserve:
      expression:
        args:
        - args:
          - field: lowalt.soc
            path: []
            role: uav
          - literal: 100.0
          op: mul
        - parameter: reserve_percent
        op: lt
      parameters:
        reserve_percent: 20.0
      profile: committed_reactive/v1
      roles:
        uav: lowalt:UAV
    closer_than_safety_distance:
      expression:
        args:
        - args:
          - field: lowalt.conflict_partner
            path: []
            role: uav
          - literal: ''
          op: ne
        - args:
          - field: lowalt.conflict_gap_m
            path:
            - 0
            role: uav
          - parameter: horizontal_m
          op: lt
        op: and
      parameters:
        horizontal_m: 20.0
      profile: committed_reactive/v1
      roles:
        uav: lowalt:UAV
    inside_no_fly_zone:
      expression:
        args:
        - field: lowalt.breached_zones
          path: []
          role: uav
        - field: lowalt.zone_id
          path: []
          role: zone
        op: contains
      profile: committed_reactive/v1
      roles:
        uav: lowalt:UAV
        zone: lowalt:AirspaceZone
    wind_above_limit:
      expression:
        args:
        - args:
          - args:
            - field: lowalt.vehicle_class
              path: []
              role: uav
            - literal: parcel
            op: eq
          - args:
            - field: lowalt.wind_mps
              path: []
              role: uav
            - parameter: parcel_limit_mps
            op: gt
          op: and
        - args:
          - args:
            - field: lowalt.vehicle_class
              path: []
              role: uav
            - literal: medical
            op: eq
          - args:
            - field: lowalt.wind_mps
              path: []
              role: uav
            - parameter: medical_limit_mps
            op: gt
          op: and
        - args:
          - args:
            - field: lowalt.vehicle_class
              path: []
              role: uav
            - literal: inspection
            op: eq
          - args:
            - field: lowalt.wind_mps
              path: []
              role: uav
            - parameter: inspection_limit_mps
            op: gt
          op: and
        - args:
          - args:
            - field: lowalt.vehicle_class
              path: []
              role: uav
            - literal: survey
            op: eq
          - args:
            - field: lowalt.wind_mps
              path: []
              role: uav
            - parameter: survey_limit_mps
            op: gt
          op: and
        - args:
          - args:
            - field: lowalt.vehicle_class
              path: []
              role: uav
            - literal: spraying
            op: eq
          - args:
            - field: lowalt.wind_mps
              path: []
              role: uav
            - parameter: spraying_limit_mps
            op: gt
          op: and
        - args:
          - args:
            - field: lowalt.vehicle_class
              path: []
              role: uav
            - literal: passenger
            op: eq
          - args:
            - field: lowalt.wind_mps
              path: []
              role: uav
            - parameter: passenger_limit_mps
            op: gt
          op: and
        - args:
          - args:
            - field: lowalt.vehicle_class
              path: []
              role: uav
            - literal: patrol
            op: eq
          - args:
            - field: lowalt.wind_mps
              path: []
              role: uav
            - parameter: patrol_limit_mps
            op: gt
          op: and
        - args:
          - args:
            - field: lowalt.vehicle_class
              path: []
              role: uav
            - literal: incident_response
            op: eq
          - args:
            - field: lowalt.wind_mps
              path: []
              role: uav
            - parameter: incident_response_limit_mps
            op: gt
          op: and
        op: or
      parameters:
        incident_response_limit_mps: 14.0
        inspection_limit_mps: 6.0
        medical_limit_mps: 12.0
        parcel_limit_mps: 12.0
        passenger_limit_mps: 15.0
        patrol_limit_mps: 12.0
        spraying_limit_mps: 5.0
        survey_limit_mps: 6.0
      profile: committed_reactive/v1
      roles:
        uav: lowalt:UAV
  registry:
    snapshot: registry.snapshot.json
  revision: 5
- bindings: []
  budgets:
    max_creations_per_instance: 8
    max_instances: 100
    max_timers_per_instance: 8
    max_transitions_per_instance_per_ns: 64
  chains: {}
  evaluator:
    dialect: original
    version: aerograph-predicate/1
  format: aeroagentsim.behaviour-package/v1
  id: lowalt.operator
  injection_points:
  - command: aas.runtime.inject_event
    emits: lowalt.operator.restaurant_delay
    id: restaurant_delay
    stream_id: operator
    target: behaviour
    topic: lowalt.events
  predicates: {}
  registry:
    snapshot: registry.snapshot.json
  revision: 1
bindings:
  commands: []
  lifecycle:
  - controller: tasks
    type: lowalt:UAV
  - controller: tasks
    type: lowalt:Site
  - controller: tasks
    type: lowalt:AirspaceZone
  - controller: tasks
    type: lowalt:Task
  - controller: environment
    type: lowalt:Environment
  - controller: behaviour
    ids: behaviour:*
    type: aas:BehaviourInstance
  rules:
  - fields:
    - lowalt.position
    - lowalt.velocity
    type: lowalt:UAV
    writer: motion
  - fields:
    - lowalt.soc
    - lowalt.charging
    - lowalt.energy_used_j
    - lowalt.distance_m
    - lowalt.motion_energy_j
    type: lowalt:UAV
    writer: energy
  - fields:
    - lowalt.membership
    - lowalt.conflicts
    - lowalt.wind_mps
    - lowalt.breached_zones
    - lowalt.conflict_partner
    - lowalt.conflict_gap_m
    type: lowalt:UAV
    writer: airspace
  - fields:
    - lowalt.capacity_j
    - lowalt.payload_kg
    - lowalt.payload_capacity_kg
    - lowalt.vehicle_class
    type: lowalt:UAV
    writer: tasks
  - fields:
    - lowalt.site_position
    - lowalt.site_open
    - lowalt.site_capacity
    type: lowalt:Site
    writer: tasks
  - fields:
    - lowalt.pad_power_w
    type: lowalt:ChargingPad
    writer: tasks
  - fields:
    - lowalt.task_state
    - lowalt.task_kind
    - lowalt.task_priority
    - lowalt.task_origin
    - lowalt.task_destination
    - lowalt.task_created_ns
    - lowalt.task_vehicle
    - lowalt.task_payload_kg
    type: lowalt:Task
    writer: tasks
  - fields:
    - lowalt.zone_kind
    - lowalt.zone_lower
    - lowalt.zone_upper
    - lowalt.zone_start_ns
    - lowalt.zone_end_ns
    - lowalt.zone_dynamic
    type: lowalt:AirspaceZone
    writer: tasks
  - fields:
    - lowalt.zone_active
    - lowalt.zone_id
    type: lowalt:AirspaceZone
    writer: airspace
  - fields:
    - lowalt.wind
    type: lowalt:Environment
    writer: environment
  - fields:
    - lowalt.weather_held
    - lowalt.wind_limit_mps
    - lowalt.returning_to_charge
    type: lowalt:UAV
    writer: behaviour
  - fields:
    - lowalt.food_preparation_s
    type: lowalt:Restaurant
    writer: tasks
  - fields:
    - lowalt.food_preparation_started_ns
    - lowalt.food_expected_ready_ns
    - lowalt.food_ready_ns
    - lowalt.food_picked_up_ns
    - lowalt.food_delivered_ns
    - lowalt.food_deadline_ns
    type: lowalt:FoodOrder
    writer: tasks
  - fields:
    - aas.behaviour.template_id
    - aas.behaviour.binding_id
    - aas.behaviour.roles
    - aas.behaviour.state
    - aas.behaviour.revision
    - aas.behaviour.status
    - aas.behaviour.children
    ids: behaviour:*
    type: aas:BehaviourInstance
    writer: behaviour
  samples: []
city: huangpu
