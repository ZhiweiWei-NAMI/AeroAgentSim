function applySearch(){const term=searchTerm.trim().toLowerCase();if(!term){$('search-result').textContent='';return;}const matches=DATA.nodes.filter(n=>[n.id,n.kind,L(n.label),L(DATA.kind_registry[n.kind])].join(' ').toLowerCase().includes(term));$('search-result').textContent=matches.length?String(matches.length):T('noResults');document.querySelectorAll('.node').forEach(g=>g.classList.toggle('dim',!matches.some(n=>n.id===g.dataset.nodeId)));if(matches.length===1&&!positions.has(matches[0].id)){$('search-result').textContent='1 ↵';}}

xtContent=L(DATA.branches[o.value]);$('legend').innerHTML=groups.map(g=>`<span><i style="background:${groupInfo[g][2]}"></i>${groupInfo[g][lang==='zh'?0:1]}</span>`).join('')+`<span>┄ ${T('runtime')}</span>`;updateViewButtons();renderBranch();draw();renderDetail();}

function aboutContent(){if(DATA.canonical_configuration){$('about-title').textContent=lang==='zh'?'同一配置，多种图视图':'One configuration, multiple graph views';$('about-content').innerHTML='<p>'+(lang==='zh'?'3D 是类型关系图：拖动旋转，Shift+拖动平移，滚轮缩放；标签始终面向屏幕。可切回平面逐边核对。定义节点和 AST 从同一份规范配置直接派生，运行记录来自该配置的夹具输出。主按钮导出原样规范配置，可再次导入工作台；不是另外一套手写图配置。':'The 3D view is a typed relationship graph: drag to rotate, Shift-drag to pan, wheel to zoom; labels face the screen. Flat mode supports edge-by-edge audit. Definitions and AST derive directly from one canonical config; records come from its fixture output. Export writes that unchanged config for reimport, not an independent diagram schema.')+'</p><p>'+(lang==='zh'?'源配置摘要：':'Configuration digest: ')+escapeHTML(DATA.canonical_config_digest)+'</p><p>'+(lang==='zh'?'静态验证和往返通过。真实飞行、图像、上传、空间几何安全和原生语义均未验证。示例期望不等于实际效果。':'Static validation and roundtrip passed. Real flight, imagery, upload, spatial safety and native semantics are unverified. Expected effects are not actual effects.')+'</p>';return;} $('about-title').textContent=lang==='zh'?'如何阅读这张图':'How to read this graph';$('about-content').innerHTML=lang==='zh'?`<p>这是一张静态、离线、可交互的类型多重图。不会发出指令、连接仿真器、识别人员或上传数据。</p><ol><li>默认主闭环突出任务变化；其他视图聚焦同一份图数据，不是另外几套模型。</li><li>悬停节点看类型与一跳关系；点击固定。悬停或点击连线查看方向、角色、组合条件与来源。</li><li>滚轮缩放，空白处拖动平移。窄屏不会把字体缩成无法阅读，请平移查看。</li><li>规则 AST 从嵌入的 definition_ast 派生，保留 state / param / const / predicate 和参数顺序。本页不求值原生规则。</li><li>实线节点表示定义/声明，虚线节点表示合成运行记录。TRUE/FALSE/UNKNOWN 是预先编写的示例结果；原生 Atlas truth 保持 UNKNOWN。</li><li>导出的 JSON 是只读展示投影，不可直接当作 workbench authoring 配置导入。kind_registry 提供概念映射，mapping 明确运行记录与扩展边的边界。</li><li>没有已核实的法规来源。安全距离与置信度阈值只属于本演练。相机、无线电与运动槽分开；能量由唯一账本结算。</li></ol><p>${DATA.coverage.node_count} 个节点，${DATA.coverage.edge_count} 条边，${DATA.coverage.kind_count} 种节点类型，${DATA.coverage.relation_count} 种关系。代表核心类型，不证明完整原生目录覆盖。</p>`:`<p>A static, offline, interactive typed multigraph. It issues no commands, connects to no simulator, identifies nobody and uploads nothing.</p><ol><li>The main loop emphasizes the task change. Focus views project the same graph data, not separate models.</li><li>Hover nodes to see type and neighbors; click to pin. Hover or select an edge for direction, roles, conditions and provenance.</li><li>Wheel to zoom; drag empty space to pan. On narrow screens, pan rather than shrink text.</li><li>AST nodes derive from the embedded definition_ast, preserving state / param / const / predicate and operand order. Native rules are not evaluated here.</li><li>Solid nodes are definitions/declarations; dashed nodes are authored runtime records. TRUE/FALSE/UNKNOWN are prewritten fixture outcomes. Native Atlas truth stays UNKNOWN.</li><li>JSON export is a read-only display projection, not a directly importable workbench authoring config. kind_registry maps concepts; mapping states trace/extension boundaries.</li><li>No verified law is asserted. Thresholds belong only to the exercise. Camera, radio and motion are separate resources; a single ledger owns energy charges.</li></ol><p>${DATA.coverage.node_count} nodes, ${DATA.coverage.edge_count} edges, ${DATA.coverage.kind_count} node kinds, ${DATA.coverage.relation_count} relations. Core families, not full native-catalog coverage.</p>`;}
